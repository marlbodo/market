<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>아이디어 제안함 · AI 마켓 인사이트</title>
<meta name="description" content="AI 마켓 인사이트를 함께 만들어 가는 아이디어·건의 제안 게시판" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #FAFAF7;
    --panel: #FFFFFF;
    --ink: #16181D;
    --ink-soft: #5B5F6B;
    --border: #E7E4DC;
    --navy: #1E3A5F;
    --gold: #B8860B;
    --gold-soft: #F4E9CE;
    --gray: #EFEDE7;
    --danger: #B3432E;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(22,24,29,0.06), 0 6px 20px rgba(22,24,29,0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    padding-bottom: 80px;
  }

  a { color: inherit; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 0;
  }

  header.page-head {
    position: relative;
    margin-bottom: 24px;
    padding-right: 76px;
  }

  h1.title-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .title-icon { width: 26px; height: 26px; flex: none; }

  .close-btn {
    position: absolute;
    right: 0;
    top: 2px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink-soft);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .close-btn:hover { border-color: var(--ink-soft); color: var(--ink); }

  .lede {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 28px 0 14px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tab {
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  .sortbtn {
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .write-btn {
    position: fixed;
    right: 20px;
    bottom: 24px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 22px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(30,58,95,0.35);
    cursor: pointer;
    z-index: 20;
  }
  .write-btn:hover { background: #16304d; }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .badge-cat {
    background: var(--gray);
    color: var(--ink-soft);
  }

  .card h3 {
    font-size: 16px;
    margin: 0 0 6px;
    font-weight: 700;
  }

  .card p.content {
    font-size: 14px;
    color: #33363E;
    margin: 0 0 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-soft);
    flex-wrap: wrap;
    gap: 8px;
  }

  .meta { display: flex; gap: 8px; align-items: center; }
  .dot::before { content: "·"; margin: 0 2px; }

  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .like-btn, .comment-toggle-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--gray);
    border: none;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--ink);
  }
  .like-btn:hover, .comment-toggle-btn:hover { background: #E4E1D8; }
  .like-btn.liked { background: var(--gold-soft); color: var(--gold); }

  .link-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 0;
  }
  .link-btn.danger { color: var(--danger); }

  /* 댓글 영역 */
  .comments {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .comments.open { display: block; }

  .comment-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .comment-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  .comment-item .comment-head {
    display: flex;
    gap: 6px;
    align-items: baseline;
    margin-bottom: 3px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .comment-item .comment-nick { font-weight: 700; color: var(--ink); }
  .comment-item .comment-body { white-space: pre-wrap; word-break: break-word; }
  .comment-empty { font-size: 12.5px; color: var(--ink-soft); padding: 4px 0 10px; }
  .comment-del-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: #B8B4A8;
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 0;
  }

  .comment-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .comment-form-row {
    display: flex;
    gap: 6px;
  }
  .comment-form input[type="text"], .comment-form input[type="password"] {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .comment-form input.c-nick { width: 76px; flex: none; }
  .comment-form input.c-password { width: 88px; flex: none; }
  .comment-form input.c-content { flex: 1; min-width: 0; }
  .comment-form button {
    border: none;
    background: var(--navy);
    color: #fff;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex: none;
  }
  .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  .comment-msg { font-size: 12px; color: var(--danger); min-height: 1em; }

  .empty, .loading {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 60px 20px;
  }

  /* modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(22,24,29,0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.open { display: flex; }

  @media (min-width: 640px) {
    .overlay { align-items: center; }
  }

  .modal {
    background: var(--panel);
    width: 100%;
    max-width: 480px;
    border-radius: 16px 16px 0 0;
    padding: 22px 20px 24px;
    max-height: 90vh;
    overflow-y: auto;
  }
  @media (min-width: 640px) {
    .modal { border-radius: 16px; }
  }

  .modal h2 {
    font-size: 18px;
    margin: 0 0 16px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .field textarea { min-height: 100px; resize: vertical; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: var(--gray); color: var(--ink); }

  .form-msg {
    font-size: 13px;
    color: var(--danger);
    margin-top: 8px;
    min-height: 1em;
  }

  footer.admin-foot {
    text-align: center;
    padding: 40px 20px 20px;
    font-size: 12px;
    color: #B5B2A9;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <button class="close-btn" onclick="window.close()">닫기</button>
    <h1 class="title-row">
      <svg class="title-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="16" cy="14" r="9.2" fill="#F4E9CE" stroke="#B8860B" stroke-width="1.6"/>
        <path d="M12 14.2c0-2.3 1.8-4.2 4-4.2s4 1.9 4 4.2c0 1.6-.9 2.5-1.7 3.3-.6.6-1 1.1-1.1 1.9h-2.4c-.1-.8-.5-1.3-1.1-1.9-.8-.8-1.7-1.7-1.7-3.3Z" fill="#B8860B"/>
        <rect x="13.4" y="20.4" width="5.2" height="1.8" rx="0.9" fill="#B8860B"/>
        <rect x="13.9" y="23" width="4.2" height="1.6" rx="0.8" fill="#B8860B"/>
        <path d="M16 3.4v2.1M27 14h-2.1M7.1 14H5M23.9 6.1l-1.5 1.5M9.6 20.4l-1.5 1.5M23.9 21.9l-1.5-1.5M9.6 7.6 8.1 6.1" stroke="#B8860B" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      함께 만들어 가는 AI 마켓 인사이트
    </h1>
    <p class="lede">사이트에 필요한 기능이나 데이터, 불편한 점을 자유롭게 남겨주세요. 댓글로 서로 의견도 나눌 수 있어요.</p>
  </header>

  <div class="toolbar">
    <div class="tabs" id="categoryTabs">
      <button class="tab active" data-cat="전체">전체</button>
      <button class="tab" data-cat="새기능 제안">새기능 제안</button>
      <button class="tab" data-cat="버그·오류 신고">버그·오류 신고</button>
      <button class="tab" data-cat="데이터 요청">데이터 요청</button>
      <button class="tab" data-cat="자유의견">자유의견</button>
    </div>
    <button class="sortbtn" id="sortToggle">최신순</button>
  </div>

  <div class="list" id="list">
    <div class="loading">불러오는 중…</div>
  </div>
</div>

<button class="write-btn" id="openWrite">✏️ 글쓰기</button>

<!-- write modal -->
<div class="overlay" id="writeOverlay">
  <div class="modal">
    <h2>아이디어 · 건의 남기기</h2>
    <div class="field-row">
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="w_nickname" maxlength="20" placeholder="예: 채권초보" />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="w_password" maxlength="50" placeholder="수정·삭제용, 4자 이상" />
      </div>
    </div>
    <div class="field">
      <label>카테고리</label>
      <select id="w_category">
        <option value="새기능 제안">새기능 제안</option>
        <option value="버그·오류 신고">버그·오류 신고</option>
        <option value="데이터 요청">데이터 요청</option>
        <option value="자유의견" selected>자유의견</option>
      </select>
    </div>
    <div class="field">
      <label>제목</label>
      <input type="text" id="w_title" maxlength="100" placeholder="한 줄로 요약해주세요" />
    </div>
    <div class="field">
      <label>내용</label>
      <textarea id="w_content" maxlength="2000" placeholder="어떤 게 필요하신지, 어떤 점이 불편하신지 적어주세요"></textarea>
    </div>
    <div class="form-msg" id="w_msg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="w_cancel">취소</button>
      <button class="btn btn-primary" id="w_submit">등록하기</button>
    </div>
  </div>
</div>

<!-- edit modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>수정하기</h2>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="e_password" maxlength="50" placeholder="작성 시 입력한 비밀번호" />
    </div>
    <div class="field">
      <label>제목</label>
      <input type="text" id="e_title" maxlength="100" />
    </div>
    <div class="field">
      <label>내용</label>
      <textarea id="e_content" maxlength="2000"></textarea>
    </div>
    <div class="form-msg" id="e_msg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="e_cancel">취소</button>
      <button class="btn btn-primary" id="e_submit">저장하기</button>
    </div>
  </div>
</div>

<footer class="admin-foot">
  AI 마켓 인사이트는 여러분의 의견을 반영하며 성장합니다.
</footer>

<script>
  const SUPABASE_URL = "https://hnxvsopwxiamexnxczhj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1_9-bKTcV3sBQkv10ru__w_iW-51pKt";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listEl = document.getElementById("list");
  const categoryTabs = document.getElementById("categoryTabs");
  const sortToggle = document.getElementById("sortToggle");

  let currentCategory = "전체";
  let sortByLikes = false;
  let cachedRows = [];
  let commentsBySuggestion = {}; // { suggestion_id: [ {nickname, content, created_at}, ... ] }
  let likedIds = new Set();      // 이 기기가 좋아요 누른 글 id들
  const openCommentIds = new Set(); // 현재 펼쳐진 댓글 영역

  // 좋아요 취소가 가능하도록, 브라우저마다 고유한 device id를 하나 만들어 재사용
  const DEVICE_KEY = "suggestions_device_id";
  function getDeviceId() {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
      try { localStorage.setItem(DEVICE_KEY, id); } catch {}
    }
    return id;
  }
  const deviceId = getDeviceId();

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  }
  function formatDateTime(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }

  async function loadList() {
    listEl.innerHTML = '<div class="loading">불러오는 중…</div>';

    const [{ data: rows, error }, { data: myLikes }, { data: comments }] = await Promise.all([
      sb.from("suggestions")
        .select("id, nickname, category, title, content, likes, created_at")
        .order("created_at", { ascending: false }),
      sb.from("suggestion_likes").select("suggestion_id").eq("device_id", deviceId),
      sb.from("suggestion_comments").select("id, suggestion_id, nickname, content, created_at").order("created_at", { ascending: true }),
    ]);

    if (error) {
      listEl.innerHTML = '<div class="empty">목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
      console.error(error);
      return;
    }

    cachedRows = rows || [];
    likedIds = new Set((myLikes || []).map(r => r.suggestion_id));

    commentsBySuggestion = {};
    (comments || []).forEach(c => {
      (commentsBySuggestion[c.suggestion_id] ||= []).push(c);
    });

    renderList();
  }

  function renderComments(id) {
    const list = commentsBySuggestion[id] || [];
    const isOpen = openCommentIds.has(id);
    const listHtml = list.length
      ? `<div class="comment-list">${list.map(c => `
          <div class="comment-item">
            <div class="comment-head">
              <span class="comment-nick">${escapeHtml(c.nickname)}</span>
              <span>${formatDateTime(c.created_at)}</span>
              <button type="button" class="comment-del-btn" data-action="delete-comment" data-comment-id="${c.id}" data-suggestion-id="${id}">삭제</button>
            </div>
            <div class="comment-body">${escapeHtml(c.content)}</div>
          </div>
        `).join("")}</div>`
      : `<div class="comment-empty">아직 댓글이 없습니다. 첫 댓글을 남겨보세요.</div>`;

    return `
      <div class="comments ${isOpen ? "open" : ""}" data-comments-for="${id}">
        ${listHtml}
        <div class="comment-form">
          <div class="comment-form-row">
            <input type="text" class="c-nick" maxlength="20" placeholder="닉네임" />
            <input type="password" class="c-password" maxlength="50" placeholder="비번(삭제용)" />
            <input type="text" class="c-content" maxlength="500" placeholder="댓글을 남겨주세요" />
            <button type="button" class="c-submit" data-id="${id}">등록</button>
          </div>
          <div class="comment-msg"></div>
        </div>
      </div>
    `;
  }

  function renderList() {
    let rows = cachedRows;
    if (currentCategory !== "전체") {
      rows = rows.filter(r => r.category === currentCategory);
    }
    if (sortByLikes) {
      rows = [...rows].sort((a, b) => b.likes - a.likes);
    }

    if (rows.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 등록된 글이 없습니다.<br />첫 번째 아이디어를 남겨주세요.</div>';
      return;
    }

    listEl.innerHTML = rows.map(r => {
      const commentCount = (commentsBySuggestion[r.id] || []).length;
      return `
      <div class="card" data-id="${r.id}">
        <div class="card-top">
          <span class="badge badge-cat">${escapeHtml(r.category)}</span>
        </div>
        <h3>${escapeHtml(r.title)}</h3>
        <p class="content">${escapeHtml(r.content)}</p>
        <div class="card-bottom">
          <div class="meta">
            <span>${escapeHtml(r.nickname)}</span>
            <span class="dot"></span>
            <span>${formatDateTime(r.created_at)}</span>
          </div>
          <div class="actions">
            <button class="like-btn ${likedIds.has(r.id) ? "liked" : ""}" data-action="like" data-id="${r.id}">
              👍 <span class="like-count">${r.likes}</span>
            </button>
            <button class="comment-toggle-btn" data-action="toggle-comments" data-id="${r.id}">
              💬 댓글 <span class="comment-count">${commentCount}</span>개
            </button>
            <button class="link-btn" data-action="edit" data-id="${r.id}">수정</button>
            <button class="link-btn danger" data-action="delete" data-id="${r.id}">삭제</button>
          </div>
        </div>
        ${renderComments(r.id)}
      </div>
    `;
    }).join("");
  }

  categoryTabs.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    currentCategory = btn.dataset.cat;
    [...categoryTabs.children].forEach(c => c.classList.toggle("active", c === btn));
    renderList();
  });

  sortToggle.addEventListener("click", () => {
    sortByLikes = !sortByLikes;
    sortToggle.textContent = sortByLikes ? "인기순" : "최신순";
    renderList();
  });

  listEl.addEventListener("click", async (e) => {
    // 댓글 등록 버튼
    const commentBtn = e.target.closest(".c-submit");
    if (commentBtn) {
      const id = commentBtn.dataset.id;
      const wrapEl = commentBtn.closest(".comments");
      const nickInput = wrapEl.querySelector(".c-nick");
      const pwInput = wrapEl.querySelector(".c-password");
      const contentInput = wrapEl.querySelector(".c-content");
      const msgEl = wrapEl.querySelector(".comment-msg");
      const nickname = nickInput.value.trim();
      const password = pwInput.value;
      const content = contentInput.value.trim();

      if (!nickname || !password || !content) {
        msgEl.textContent = "닉네임, 비밀번호, 댓글 내용을 모두 입력해주세요.";
        return;
      }
      if (password.length < 4) {
        msgEl.textContent = "비밀번호는 4자 이상이어야 합니다.";
        return;
      }

      commentBtn.disabled = true;
      const { error } = await sb.rpc("create_suggestion_comment", {
        p_suggestion_id: id,
        p_nickname: nickname,
        p_password: password,
        p_content: content,
      });
      commentBtn.disabled = false;

      if (error) {
        msgEl.textContent = "댓글 등록에 실패했습니다.";
        console.error(error);
        return;
      }

      pwInput.value = "";
      contentInput.value = "";
      openCommentIds.add(id);

      const { data: newComments } = await sb
        .from("suggestion_comments")
        .select("id, suggestion_id, nickname, content, created_at")
        .eq("suggestion_id", id)
        .order("created_at", { ascending: true });
      commentsBySuggestion[id] = newComments || [];
      renderList();
      return;
    }

    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;

    if (action === "delete-comment") {
      const commentId = btn.dataset.commentId;
      const suggestionId = btn.dataset.suggestionId;
      const pw = prompt("댓글을 삭제하려면 비밀번호를 입력해주세요.");
      if (pw === null) return;

      const { error } = await sb.rpc("delete_suggestion_comment", {
        p_id: commentId,
        p_password: pw,
      });

      if (error) {
        alert(error.message.includes("일치") ? "비밀번호가 일치하지 않습니다." : "댓글 삭제에 실패했습니다.");
        return;
      }

      openCommentIds.add(suggestionId);
      const { data: newComments } = await sb
        .from("suggestion_comments")
        .select("id, suggestion_id, nickname, content, created_at")
        .eq("suggestion_id", suggestionId)
        .order("created_at", { ascending: true });
      commentsBySuggestion[suggestionId] = newComments || [];
      renderList();
      return;
    }

    if (action === "toggle-comments") {
      if (openCommentIds.has(id)) openCommentIds.delete(id);
      else openCommentIds.add(id);
      renderList();
      return;
    }

    if (action === "like") {
      // 실수로 누르는 경우가 있어, 한 번 더 누르면 좋아요가 취소되도록 토글 방식으로 동작
      btn.disabled = true;
      const { data, error } = await sb.rpc("toggle_suggestion_like", {
        p_id: id,
        p_device_id: deviceId,
      });
      btn.disabled = false;

      if (error || !data || !data[0]) {
        alert("좋아요 처리에 실패했습니다.");
        console.error(error);
        return;
      }

      const { likes, liked } = data[0];
      if (liked) likedIds.add(id); else likedIds.delete(id);
      btn.classList.toggle("liked", liked);
      btn.querySelector(".like-count").textContent = likes;
      const row = cachedRows.find(r => r.id === id);
      if (row) row.likes = likes;
    }

    if (action === "delete") {
      const pw = prompt("삭제하려면 비밀번호를 입력해주세요.");
      if (pw === null) return;
      const { error } = await sb.rpc("delete_suggestion", { p_id: id, p_password: pw });
      if (error) {
        alert(error.message.includes("일치") ? "비밀번호가 일치하지 않습니다." : "삭제에 실패했습니다.");
        return;
      }
      cachedRows = cachedRows.filter(r => r.id !== id);
      renderList();
    }

    if (action === "edit") {
      openEdit(id);
    }
  });

  // write modal
  const writeOverlay = document.getElementById("writeOverlay");
  document.getElementById("openWrite").addEventListener("click", () => {
    document.getElementById("w_msg").textContent = "";
    writeOverlay.classList.add("open");
  });
  document.getElementById("w_cancel").addEventListener("click", () => writeOverlay.classList.remove("open"));

  document.getElementById("w_submit").addEventListener("click", async () => {
    const nickname = document.getElementById("w_nickname").value.trim();
    const password = document.getElementById("w_password").value;
    const category = document.getElementById("w_category").value;
    const title = document.getElementById("w_title").value.trim();
    const content = document.getElementById("w_content").value.trim();
    const msgEl = document.getElementById("w_msg");

    if (!nickname || !password || !title || !content) {
      msgEl.textContent = "모든 항목을 입력해주세요.";
      return;
    }
    if (password.length < 4) {
      msgEl.textContent = "비밀번호는 4자 이상이어야 합니다.";
      return;
    }

    const submitBtn = document.getElementById("w_submit");
    submitBtn.disabled = true;
    msgEl.textContent = "";

    const { error } = await sb.rpc("create_suggestion", {
      p_nickname: nickname,
      p_password: password,
      p_category: category,
      p_title: title,
      p_content: content
    });

    submitBtn.disabled = false;

    if (error) {
      msgEl.textContent = "등록에 실패했습니다. 다시 시도해주세요.";
      console.error(error);
      return;
    }

    writeOverlay.classList.remove("open");
    document.getElementById("w_nickname").value = "";
    document.getElementById("w_password").value = "";
    document.getElementById("w_title").value = "";
    document.getElementById("w_content").value = "";
    await loadList();
  });

  // edit modal
  const editOverlay = document.getElementById("editOverlay");
  let editingId = null;

  function openEdit(id) {
    const row = cachedRows.find(r => r.id === id);
    if (!row) return;
    editingId = id;
    document.getElementById("e_password").value = "";
    document.getElementById("e_title").value = row.title;
    document.getElementById("e_content").value = row.content;
    document.getElementById("e_msg").textContent = "";
    editOverlay.classList.add("open");
  }

  document.getElementById("e_cancel").addEventListener("click", () => editOverlay.classList.remove("open"));

  document.getElementById("e_submit").addEventListener("click", async () => {
    const password = document.getElementById("e_password").value;
    const title = document.getElementById("e_title").value.trim();
    const content = document.getElementById("e_content").value.trim();
    const msgEl = document.getElementById("e_msg");

    if (!password || !title || !content) {
      msgEl.textContent = "모든 항목을 입력해주세요.";
      return;
    }

    const submitBtn = document.getElementById("e_submit");
    submitBtn.disabled = true;

    const { error } = await sb.rpc("update_suggestion", {
      p_id: editingId,
      p_password: password,
      p_title: title,
      p_content: content
    });

    submitBtn.disabled = false;

    if (error) {
      msgEl.textContent = error.message.includes("일치") ? "비밀번호가 일치하지 않습니다." : "수정에 실패했습니다.";
      return;
    }

    editOverlay.classList.remove("open");
    await loadList();
  });

  loadList();
</script>
</body>
</html>
