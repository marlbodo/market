<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차트로 보기 | 데일리 마켓 브리핑</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f4f5f7;
    color: #1f2430;
  }
  .chart-wrap { max-width: 1560px; margin: 0 auto; padding: 16px 18px 40px; }

  .page-header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 16px;
  }
  .page-header-row h1 { font-size: 18px; margin: 0; }
  .close-btn {
    border: 1px solid #d7dae0; background: #fff; color: #374151;
    padding: 6px 14px; border-radius: 7px; font-size: 13px; cursor: pointer;
  }
  .close-btn:hover { background: #f3f4f6; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .range-group { display: flex; gap: 4px; }
  .range-btn, .action-btn {
    border: 1px solid #d7dae0; background: #fff; color: #374151;
    padding: 6px 12px; border-radius: 7px; font-size: 13px; cursor: pointer;
  }
  .range-btn.is-active { background: #16305c; color: #fff; border-color: #16305c; }
  .action-btn.is-active { background: #e3f5ee; color: #1f8266; border-color: #8fd9bd; font-weight: 600; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .spacer { flex: 1; }

  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .picker-panel, .chart-panel {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px;
  }
  .picker-panel h2, .chart-panel h2 { font-size: 14px; margin: 0 0 10px; color: #374151; }
  .picker-search {
    width: 100%; padding: 7px 10px; border: 1px solid #d7dae0; border-radius: 7px;
    font-size: 13px; margin-bottom: 8px;
  }
  .picker-group-label {
    font-size: 11px; color: #1f2430; font-weight: 700; margin: 10px 0 4px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .picker-list { max-height: 600px; overflow-y: auto; }
  .picker-item {
    display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .picker-item:hover { background: #f3f4f6; }
  .picker-item input { pointer-events: none; }

  .selected-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px;
    background: #fff; border: 1.4px solid var(--chip-color, #ccc); color: var(--chip-color, #374151);
  }
  .chip .chip-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color, #999); flex-shrink: 0;
  }
  .chip .axis-btn {
    background: rgba(0,0,0,0.06); border: none; color: inherit; border-radius: 999px;
    font-size: 11px; padding: 2px 6px; cursor: pointer;
  }
  .chip .remove-btn {
    background: rgba(0,0,0,0.1); border: none; color: inherit; border-radius: 999px;
    width: 18px; height: 18px; line-height: 1; cursor: pointer; font-size: 12px;
  }

  .chart-canvas-box { position: relative; height: 640px; }
  .chart-empty { color: #9ca3af; font-size: 13px; text-align: center; padding: 60px 0; }
  .chart-loading { color: #9ca3af; font-size: 13px; text-align: center; padding: 60px 0; }
</style>
</head>
<body>

<div class="chart-wrap">
  <div class="page-header-row">
    <h1>📈 지표 비교 차트</h1>
    <button class="close-btn" id="close-btn">✕ 닫기</button>
  </div>

  <div class="toolbar">
    <div class="range-group" id="range-group">
      <button class="range-btn" data-months="1">1개월</button>
      <button class="range-btn" data-months="6">6개월</button>
      <button class="range-btn is-active" data-months="12">1년</button>
      <button class="range-btn" data-months="36">3년</button>
      <button class="range-btn" data-months="60">5년</button>
      <button class="range-btn" data-months="120">10년</button>
      <button class="range-btn" data-months="0">전체</button>
    </div>
    <div class="spacer"></div>
    <button class="action-btn" id="spread-btn" disabled>스프레드 계산 (A-B)</button>
    <button class="action-btn" id="excel-btn" disabled>엑셀로 저장</button>
    <button class="action-btn" id="clear-btn">전체 지우기</button>
  </div>

  <div class="layout">
    <div class="picker-panel">
      <h2>지표 선택</h2>
      <input class="picker-search" id="picker-search" placeholder="지표 검색 (예: 국고, CPI, GDP)">
      <div class="picker-list" id="picker-list">
        <div class="chart-loading">지표 목록을 불러오는 중…</div>
      </div>
    </div>

    <div class="chart-panel">
      <h2>선택한 지표</h2>
      <div class="selected-chips" id="selected-chips"></div>
      <div class="chart-canvas-box">
        <canvas id="main-chart"></canvas>
        <div class="chart-empty" id="chart-empty">왼쪽에서 지표를 선택하면 여기에 차트가 표시됩니다.</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://hnxvsopwxiamexnxczhj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhueHZzb3B3eGlhbWV4bnhjemhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjAzNjksImV4cCI6MjA5NzgzNjM2OX0._7LzP4rrjM1F06Dya_vX_kTA4t1jw7DlR6ExWlvhxak";

  const SOURCE_LABEL = { rate: '금리(국내)', kr_econ: '경제지표(한국)', us_econ: '경제지표(미국)' };
  const PALETTE = ['#16305c', '#c0392b', '#0f7a6b', '#b7791f', '#7f77dd', '#2b6fd9', '#d4537e', '#556b2f', '#8e44ad', '#e67e22'];

  const SPREAD_LINE_COLOR = '#3fae86';
  const SPREAD_FILL_COLOR = 'rgba(93, 202, 165, 0.35)';

  const LEVEL_ONLY_KEYS = new Set([
    'us_econ::실업률',
    'kr_econ::경상수지',
  ]);

  const MOM_DIFF_KEYS = new Set([
    'us_econ::비농업고용자수',
  ]);

  // 월/분기 단위로 발표되는 지표는 화면에 "해당 기간의 마지막 날"로 표시
  // (예: 원 데이터가 매월 1일로 저장되어 있어도 10.1이 아니라 10.31로 표시)
  const QUARTERLY_KEYS = new Set([
    'us_econ::GDP(실질)',
    'kr_econ::국내총생산(실질, 계절조정)',
  ]);
  const MONTHLY_ECON_SOURCES = new Set(['us_econ', 'kr_econ']);

  function endOfMonth(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return end.toISOString().slice(0, 10);
  }
  function endOfQuarter(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const q = Math.floor(d.getMonth() / 3);
    const end = new Date(d.getFullYear(), q * 3 + 3, 0);
    return end.toISOString().slice(0, 10);
  }

  let ALL_INDICATORS = [];
  let SELECTED = [];
  let SPREAD_ON = false;
  let RANGE_MONTHS = 12;
  let chartInstance = null;

  function chipKey(item) { return `${item.source}::${item.indicator_name}`; }

  async function fetchRpc(fnName, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(body || {}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} (${fnName})`);
    return res.json();
  }

  function startDateFor(months) {
    if (!months) return '1970-01-01';
    const d = new Date();
    d.setMonth(d.getMonth() - months);
    return d.toISOString().slice(0, 10);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function monthsBetween(a, b) {
    return (a.getFullYear() - b.getFullYear()) * 12 + (a.getMonth() - b.getMonth());
  }

  function computeYoY(rawSeries) {
    const points = rawSeries.map((p) => ({ date: new Date(p.x + 'T00:00:00'), x: p.x, y: p.y }));
    const out = [];
    for (let i = 0; i < points.length; i++) {
      const cur = points[i];
      const target = new Date(cur.date);
      target.setFullYear(target.getFullYear() - 1);

      let best = null;
      let bestDiff = Infinity;
      for (let j = 0; j < i; j++) {
        const pj = points[j];
        if (Math.abs(monthsBetween(pj.date, target)) > 1) continue;
        const diff = Math.abs(pj.date.getTime() - target.getTime());
        if (diff < bestDiff) { bestDiff = diff; best = pj; }
      }
      if (best && best.y !== 0) {
        out.push({ x: cur.x, y: ((cur.y - best.y) / Math.abs(best.y)) * 100 });
      }
    }
    return out;
  }

  function computeMoMDiff(rawSeries) {
    const out = [];
    for (let i = 1; i < rawSeries.length; i++) {
      out.push({ x: rawSeries[i].x, y: rawSeries[i].y - rawSeries[i - 1].y });
    }
    return out;
  }

  async function loadIndicatorList() {
    const listEl = document.getElementById('picker-list');
    try {
      const rows = await fetchRpc('get_all_indicator_names');
      ALL_INDICATORS = rows;
      renderPickerList(rows);
      applyPresetFromUrl();
    } catch (err) {
      listEl.innerHTML = `<div class="chart-empty">지표 목록을 불러오지 못했습니다.</div>`;
      console.error(err);
    }
  }

  function renderPickerList(rows) {
    const listEl = document.getElementById('picker-list');
    const groups = { rate: [], kr_econ: [], us_econ: [] };
    rows.forEach((r) => { if (groups[r.source]) groups[r.source].push(r); });

    let html = '';
    Object.keys(groups).forEach((source) => {
      if (groups[source].length === 0) return;
      html += `<div class="picker-group-label">${SOURCE_LABEL[source]}</div>`;
      groups[source].forEach((item) => {
        const key = chipKey(item);
        const checked = SELECTED.some((s) => chipKey(s) === key);
        html += `
          <label class="picker-item" data-key="${escapeHtml(key)}">
            <input type="checkbox" ${checked ? 'checked' : ''} data-source="${escapeHtml(item.source)}" data-name="${escapeHtml(item.indicator_name)}">
            <span>${escapeHtml(item.indicator_name)}</span>
          </label>`;
      });
    });
    listEl.innerHTML = html || '<div class="chart-empty">지표가 없습니다.</div>';

    listEl.querySelectorAll('.picker-item input').forEach((cb) => {
      cb.addEventListener('change', () => {
        const source = cb.getAttribute('data-source');
        const name = cb.getAttribute('data-name');
        if (cb.checked) addIndicator(source, name);
        else removeIndicator(source, name);
      });
    });
  }

  function filterPickerList(query) {
    const q = query.trim().toLowerCase();
    if (!q) { renderPickerList(ALL_INDICATORS); return; }
    renderPickerList(ALL_INDICATORS.filter((r) => r.indicator_name.toLowerCase().includes(q)));
  }

  function addIndicator(source, indicator_name) {
    const key = `${source}::${indicator_name}`;
    if (SELECTED.some((s) => chipKey(s) === key)) return;
    const usedColors = new Set(SELECTED.map((s) => s.color));
    const color = PALETTE.find((c) => !usedColors.has(c)) || PALETTE[SELECTED.length % PALETTE.length];
    SELECTED.push({ source, indicator_name, color, axis: 'left' });
    renderChips();
    updateActionButtonsState();
    refreshChart();
  }

  function removeIndicator(source, indicator_name) {
    SELECTED = SELECTED.filter((s) => !(s.source === source && s.indicator_name === indicator_name));
    SPREAD_ON = false;
    renderChips();
    updateActionButtonsState();
    refreshChart();
    document.querySelectorAll(`.picker-item input[data-source="${CSS.escape(source)}"][data-name="${CSS.escape(indicator_name)}"]`)
      .forEach((cb) => { cb.checked = false; });
  }

  function toggleAxis(source, indicator_name) {
    const item = SELECTED.find((s) => s.source === source && s.indicator_name === indicator_name);
    if (!item) return;
    item.axis = item.axis === 'left' ? 'right' : 'left';
    renderChips();
    refreshChart();
  }

  function renderChips() {
    const box = document.getElementById('selected-chips');
    if (SELECTED.length === 0) {
      box.innerHTML = '<span style="color:#9ca3af;font-size:13px;">아직 선택한 지표가 없습니다.</span>';
      return;
    }
    box.innerHTML = SELECTED.map((s) => `
      <span class="chip" style="--chip-color:${s.color}">
        <span class="chip-dot"></span>
        ${escapeHtml(s.indicator_name)}
        <button class="axis-btn" data-action="axis" data-source="${escapeHtml(s.source)}" data-name="${escapeHtml(s.indicator_name)}">${s.axis === 'left' ? '좌축' : '우축'}</button>
        <button class="remove-btn" data-action="remove" data-source="${escapeHtml(s.source)}" data-name="${escapeHtml(s.indicator_name)}">×</button>
      </span>`).join('');

    box.querySelectorAll('[data-action="remove"]').forEach((btn) => {
      btn.addEventListener('click', () => removeIndicator(btn.getAttribute('data-source'), btn.getAttribute('data-name')));
    });
    box.querySelectorAll('[data-action="axis"]').forEach((btn) => {
      btn.addEventListener('click', () => toggleAxis(btn.getAttribute('data-source'), btn.getAttribute('data-name')));
    });
  }

  function updateActionButtonsState() {
    const spreadBtn = document.getElementById('spread-btn');
    spreadBtn.disabled = SELECTED.length !== 2;
    if (SELECTED.length !== 2) SPREAD_ON = false;
    spreadBtn.classList.toggle('is-active', SPREAD_ON);

    const excelBtn = document.getElementById('excel-btn');
    excelBtn.disabled = SELECTED.length === 0;
  }

  async function fetchSeries(item, startDate) {
    const isEcon = MONTHLY_ECON_SOURCES.has(item.source);
    const isMoMDiff = MOM_DIFF_KEYS.has(chipKey(item));
    const needsYoY = isEcon && !isMoMDiff && !LEVEL_ONLY_KEYS.has(chipKey(item));

    let fetchStart = startDate;
    if (needsYoY && startDate !== '1970-01-01') {
      const d = new Date(startDate + 'T00:00:00');
      d.setMonth(d.getMonth() - 13);
      fetchStart = d.toISOString().slice(0, 10);
    } else if (isMoMDiff && startDate !== '1970-01-01') {
      const d = new Date(startDate + 'T00:00:00');
      d.setMonth(d.getMonth() - 2);
      fetchStart = d.toISOString().slice(0, 10);
    }

    const rows = await fetchRpc('get_indicator_series', {
      p_source: item.source,
      p_indicator: item.indicator_name,
      p_start: fetchStart,
    });
    let series = rows.map((r) => ({ x: r.series_date, y: Number(r.value) }));

    if (needsYoY) {
      series = computeYoY(series).filter((p) => p.x >= startDate);
    } else if (isMoMDiff) {
      series = computeMoMDiff(series).filter((p) => p.x >= startDate);
    }

    // 월/분기 지표는 표시용 x값만 기간 말일로 밀어줌 (YoY/MoM 계산은 이미 끝난 뒤이므로 안전)
    if (isEcon) {
      const isQuarterly = QUARTERLY_KEYS.has(chipKey(item));
      series = series.map((p) => ({ x: isQuarterly ? endOfQuarter(p.x) : endOfMonth(p.x), y: p.y }));
    }

    return series;
  }

  function computeSpread(seriesA, seriesB) {
    const mapB = new Map(seriesB.map((p) => [p.x, p.y]));
    const out = [];
    seriesA.forEach((p) => {
      if (mapB.has(p.x)) out.push({ x: p.x, y: p.y - mapB.get(p.x) });
    });
    return out;
  }

  function squishedAxisRange(values, fraction) {
    if (!values.length) return { min: 0, max: 1 };
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min -= 0.1; max += 0.1; }
    const span = max - min;
    const axisMin = min - span * 0.08;
    const axisMax = axisMin + (max - axisMin) / fraction;
    return { min: axisMin, max: axisMax };
  }

  function formatDatasetValue(ds, rawValue) {
    const decimals = ds._decimals ?? 2;
    const unit = ds._unit || '';
    const num = Number(rawValue);
    const sign = ds._signed && num > 0 ? '+' : '';
    return `${sign}${num.toFixed(decimals)}${unit}`;
  }

  const endLabelPlugin = {
    id: 'endLabel',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea } = chart;
      if (!chartArea) return;
      chart.data.datasets.forEach((ds, i) => {
        const meta = chart.getDatasetMeta(i);
        if (!meta || meta.hidden || !ds.data || !ds.data.length) return;
        const lastIdx = ds.data.length - 1;
        const point = meta.data[lastIdx];
        const raw = ds.data[lastIdx];
        if (!point || raw == null || raw.y == null || isNaN(raw.y)) return;

        const text = formatDatasetValue(ds, raw.y);

        ctx.save();
        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
        const textWidth = ctx.measureText(text).width;
        const x = Math.min(point.x + 6, chart.width - textWidth - 6);
        const y = point.y;

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(x - 3, y - 8, textWidth + 6, 16);

        ctx.fillStyle = ds.borderColor || '#111827';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText(text, x, y);
        ctx.restore();
      });
    },
  };
  Chart.register(endLabelPlugin);

  // 마우스를 올렸을 때 그 x 위치에 세로 점선을 그어주는 크로스헤어
  const crosshairPlugin = {
    id: 'crosshair',
    afterDatasetsDraw(chart) {
      const active = chart.getActiveElements();
      if (!active || active.length === 0) return;
      const { ctx, chartArea } = chart;
      const x = active[0].element.x;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(55, 65, 81, 0.45)';
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.restore();
    },
  };
  Chart.register(crosshairPlugin);

  async function refreshChart() {
    const emptyEl = document.getElementById('chart-empty');
    const canvas = document.getElementById('main-chart');

    if (SELECTED.length === 0) {
      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      emptyEl.textContent = '왼쪽에서 지표를 선택하면 여기에 차트가 표시됩니다.';
      emptyEl.style.display = 'block';
      return;
    }

    emptyEl.textContent = '데이터를 불러오는 중…';
    emptyEl.style.display = 'block';

    try {
      const startDate = startDateFor(RANGE_MONTHS);
      const seriesList = await Promise.all(SELECTED.map((item) => fetchSeries(item, startDate)));

      const datasets = SELECTED.map((item, i) => {
        const isMoMDiff = MOM_DIFF_KEYS.has(chipKey(item));
        const usesYoY = MONTHLY_ECON_SOURCES.has(item.source) && !isMoMDiff && !LEVEL_ONLY_KEYS.has(chipKey(item));
        const isRawPercent = item.source === 'us_econ' && item.indicator_name === '실업률';
        let unit = '';
        let decimals = item.source === 'rate' ? 3 : 1;
        if (usesYoY || isRawPercent) { unit = '%'; decimals = 2; }
        else if (isMoMDiff) { unit = '천명'; decimals = 0; }
        const signed = isMoMDiff;

        return {
          label: item.indicator_name,
          data: seriesList[i],
          borderColor: item.color,
          backgroundColor: item.color,
          yAxisID: item.axis === 'left' ? 'y' : 'y1',
          borderWidth: 1.6,
          pointRadius: 0,
          tension: 0.05,
          pointStyle: 'line',
          _unit: unit,
          _decimals: decimals,
          _signed: signed,
        };
      });

      let spreadAxisRange = { min: undefined, max: undefined };
      const usesSpread = SPREAD_ON && SELECTED.length === 2;

      if (usesSpread) {
        const spread = computeSpread(seriesList[0], seriesList[1]);
        const spreadValues = spread.map((p) => p.y).filter((v) => !isNaN(v));
        spreadAxisRange = squishedAxisRange(spreadValues, 0.32);

        datasets.push({
          label: `스프레드 (${SELECTED[0].indicator_name} − ${SELECTED[1].indicator_name})`,
          data: spread,
          borderColor: SPREAD_LINE_COLOR,
          backgroundColor: SPREAD_FILL_COLOR,
          yAxisID: 'y2',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.05,
          fill: 'start',
          pointStyle: 'rect',
          order: -1,
          _unit: '',
          _decimals: 3,
        });
      }

      const usesRight = SELECTED.some((s) => s.axis === 'right');

      if (chartInstance) chartInstance.destroy();
      emptyEl.style.display = 'none';

      chartInstance = new Chart(canvas, {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 58 } },
          interaction: { mode: 'x', intersect: false },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { usePointStyle: true, boxWidth: 26, boxHeight: 10 },
            },
            // 세로 크로스헤어 + 그 위치의 값들만 간단히 보여주는 툴팁
            tooltip: {
              enabled: true,
              mode: 'x',
              intersect: false,
              backgroundColor: 'rgba(31, 36, 48, 0.92)',
              titleFont: { size: 11 },
              bodyFont: { size: 12 },
              padding: 8,
              boxPadding: 3,
              callbacks: {
                label: (ctx) => {
                  const ds = ctx.dataset;
                  return `${ds.label}: ${formatDatasetValue(ds, ctx.parsed.y)}`;
                },
              },
            },
          },
          scales: {
            x: {
              type: 'time',
              time: {
                tooltipFormat: 'yyyy.MM.dd',
                displayFormats: {
                  day: 'M.d',
                  week: 'M.d',
                  month: 'yy.M',
                  quarter: 'yy.M',
                  year: 'yyyy',
                },
              },
            },
            y: { type: 'linear', position: 'left', title: { display: usesRight, text: '좌축' } },
            y1: {
              type: 'linear', position: 'right', title: { display: usesRight, text: '우축' },
              grid: { drawOnChartArea: false }, display: usesRight,
            },
            y2: {
              type: 'linear', position: 'right', display: usesSpread,
              min: spreadAxisRange.min, max: spreadAxisRange.max,
              grid: { drawOnChartArea: false },
              ticks: { color: SPREAD_LINE_COLOR, font: { size: 10 } },
            },
          },
        },
      });
    } catch (err) {
      emptyEl.textContent = '데이터를 불러오지 못했습니다.';
      console.error(err);
    }
  }

  function exportToExcel() {
    if (!chartInstance || SELECTED.length === 0) return;
    const datasets = chartInstance.data.datasets;
    const maps = datasets.map((ds) => new Map(ds.data.map((p) => [p.x, p.y])));
    const allDatesSet = new Set();
    datasets.forEach((ds) => ds.data.forEach((p) => allDatesSet.add(p.x)));
    const allDates = Array.from(allDatesSet).sort();

    const header = ['날짜', ...datasets.map((ds) => ds.label)];
    const rows = allDates.map((date) => {
      const row = [date];
      maps.forEach((m) => {
        const v = m.get(date);
        row.push(v === undefined ? '' : Number(v.toFixed(4)));
      });
      return row;
    });

    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '차트데이터');
    const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    XLSX.writeFile(wb, `차트데이터_${todayStr}.xlsx`);
  }

  function applyPresetFromUrl() {
    const params = new URLSearchParams(location.search);
    const preset = params.get('preset');
    if (preset === 'rates') {
      ['국고 10Y', '국고 3Y'].forEach((name) => {
        if (ALL_INDICATORS.some((r) => r.source === 'rate' && r.indicator_name === name)) addIndicator('rate', name);
      });
      SPREAD_ON = true;
    } else if (preset === 'econ') {
      if (ALL_INDICATORS.some((r) => r.source === 'us_econ' && r.indicator_name === 'CPI')) addIndicator('us_econ', 'CPI');
    }
    renderPickerList(ALL_INDICATORS);
    updateActionButtonsState();
    refreshChart();
  }

  document.getElementById('picker-search').addEventListener('input', (e) => filterPickerList(e.target.value));

  document.querySelectorAll('.range-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      RANGE_MONTHS = Number(btn.getAttribute('data-months'));
      refreshChart();
    });
  });

  document.getElementById('spread-btn').addEventListener('click', function () {
    if (this.disabled) return;
    SPREAD_ON = !SPREAD_ON;
    this.classList.toggle('is-active', SPREAD_ON);
    refreshChart();
  });

  document.getElementById('excel-btn').addEventListener('click', exportToExcel);

  document.getElementById('clear-btn').addEventListener('click', () => {
    SELECTED = [];
    SPREAD_ON = false;
    renderChips();
    updateActionButtonsState();
    renderPickerList(ALL_INDICATORS.length ? ALL_INDICATORS : []);
    refreshChart();
  });

  document.getElementById('close-btn').addEventListener('click', () => {
    window.close();
  });

  renderChips();
  loadIndicatorList();
})();
</script>
</body>
</html>
