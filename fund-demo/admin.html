<!DOCTYPE html>
<html lang="ko">
<head>

<title>수익자 통합 집계 대시보드 (데모) — AI 마켓 인사이트</title>
<style>
  :root {
    --ink: #14171f; --ink-soft: #5b5f6b; --border: #e6e8ec; --border-strong: #d6dae1;
    --bg: #ffffff; --bg-subtle: #f6f7f9; --accent: #16305c; --accent-soft: #eaf0fb;
    --teal: #0f7a6b; --teal-soft: #e1f3ef; --amber: #b7791f; --amber-soft: #fbf0dd;
    --purple: #7f77dd; --danger: #b3432e; --danger-soft: #fbeae6; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-subtle); color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 20px 24px 60px; }

  .demo-banner {
    background: #fff7e6; border: 1px solid #f0c869; color: #8a5a15;
    border-radius: var(--radius); padding: 10px 16px; font-size: 12.5px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .demo-banner a { color: #8a5a15; text-decoration: underline; }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .top-bar h1 { font-size: 21px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 사이트 톤에 맞춘 라인 아이콘 (검정 대신 브랜드 컬러) */
  .section-icon { display: inline-flex; align-items: center; justify-content: center; color: var(--teal); flex: none; }
  .section-icon svg { width: 19px; height: 19px; }

  .btn { border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: #0b6357; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: #0f2247; }
  .btn-ghost { background: var(--bg); border: 1px solid var(--border-strong); color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--bg-subtle); }
  .btn-danger-outline { background: var(--danger-soft); color: var(--danger); border: 1px solid #f0c1b4; }

  .table-scroll { width: 100%; overflow-x: auto; background: #fff; border: 1px solid var(--border-strong); border-radius: 10px; }
  table.dash {
    width: 100%; min-width: 1440px; border-collapse: collapse; font-size: 12.5px;
  }
  table.dash th, table.dash td {
    border: 1px solid var(--border); padding: 8px 7px; text-align: center; white-space: nowrap;
  }
  table.dash thead th {
    background: var(--bg-subtle); font-weight: 700; color: var(--ink-soft); font-size: 11.5px;
  }
  table.dash td.left { text-align: left; }
  table.dash tbody tr:hover td { background: #f2f5fa; }
  table.dash tfoot td { font-weight: 700; background: var(--bg-subtle); }
  table.dash tbody tr.excluded-row td { opacity: 0.45; text-decoration: line-through; }

  .group-bond { background: var(--teal-soft); }
  .group-cd { background: var(--accent-soft); }

  .link-btn { color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 12px; background:none; border:none; }
  .del-link { color: var(--danger); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 12px; background:none; border:none; }
  .restore-link { color: var(--teal); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 12px; background:none; border:none; }

  .detail-row td { text-align: left; background: #fbfcfd; white-space: normal; padding: 16px 20px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
  .detail-grid h4 { font-size: 12.5px; margin: 0 0 8px; color: var(--ink-soft); }
  table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.mini th, table.mini td { border: 1px solid var(--border); padding: 5px 7px; text-align: center; }
  table.mini td:first-child { text-align: left; }
  table.mini tfoot td { font-weight: 700; background: var(--bg-subtle); }
  .detail-footnote { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; }

  .excluded-panel {
    margin-top: 16px; border: 1px dashed var(--border-strong); border-radius: 10px;
    padding: 12px 16px; font-size: 12.5px; color: var(--ink-soft); background: #fbfbfc;
  }
  .excluded-panel strong { color: var(--ink); }
  .excluded-chip {
    display: inline-flex; align-items: center; gap: 8px; background: #fff;
    border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 6px 4px 12px;
    margin: 4px 6px 0 0; font-size: 12px;

  .caption-note { font-size: 11.5px; color: var(--ink-soft); margin: 8px 2px 0; line-height: 1.6; }

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

          bonds: [ { name: '산금25신이0200-0912-2', amount: 50, rate: 3.968, md: 0.96 } ],

          bonds: [
            { name: '산금22신이0500-0908-2', amount: 500, rate: 3.966, md: 0.94 },

          ],

        { id: 'eunhasu-1', company: '은하수자산', fundName: '은하수12호', equity: 450.7, shareRatio: 50, feeBp: 8, repoRate: 2.55,
          bonds: [ { name: '산금25신이0200-0711-2', amount: 400, rate: 3.943, md: 0.79 } ],
          cds: [ { name: 'CD(국민은행자금부20260713-74.7-2)', amount: 74.7, rate: 3.16, md: 0.25 } ] },
        { id: 'miraesol-1', company: '미래솔자산', fundName: '미래솔7호', equity: 700.2, shareRatio: 50, feeBp: 8, repoRate: 2.55,
          bonds: [
            { name: '기업은행(신)2507이2A-21', amount: 448.3, rate: 3.946, md: 0.82 },

        { id: 'taeyang-1', company: '태양자산', fundName: '태양9호', equity: 380.5, shareRatio: 50, feeBp: 8, repoRate: 2.55,
          bonds: [ { name: '산금22신이0500-0823-1', amount: 199, rate: 3.960, md: 0.90 } ],
          cds: [ { name: 'CD(국민은행자금부20260228-199-3)', amount: 199, rate: 3.20, md: 0.25 } ] },

          bonds: [ { name: '산금25신이0206-0131-2', amount: 448.3, rate: 3.950, md: 0.84 } ],
          cds: [ { name: 'CD(스탠다드차타드은행자금부20260612-100-2)', amount: 100, rate: 3.32, md: 0.28 } ] },
      ],

  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.warn('demo storage read failed', e); }
    const seed = seedData();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(seed)); } catch (e) {}
    return seed;
  }

  function loadExcluded() {
    try {
      const raw = sessionStorage.getItem(EXCLUDED_KEY);
      if (raw) return new Set(JSON.parse(raw));
    } catch (e) {}
    return new Set();
  }
  function saveExcluded(set) {
    try { sessionStorage.setItem(EXCLUDED_KEY, JSON.stringify([...set])); } catch (e) {}
  }
  let excludedIds = loadExcluded();

  function weightedAvg(items, field) {
    const totalAmt = items.reduce((s, it) => s + it.amount, 0);
    if (totalAmt === 0) return 0;
    return items.reduce((s, it) => s + it.amount * it[field], 0) / totalAmt;
  }
  function pvbp(amount, md) { return amount * md * 0.0001; }

  // 채권/CD 금액, 레버리지, 연간수익은 전부 "수익자분(지분)" 기준으로 계산한다.
  //   scale = 지분율/100
  //   수익자분 채권·CD금액 = 펀드 전체 채권·CD금액 × scale
  //   레버리지 = (수익자분 채권+CD) / 수익자분 × 100% − 100%
  //   연간수익(수익자분) = 펀드 전체 연간수익 × scale  (= 예상수익률은 기존과 동일)
  function computeFund(fund) {
    const scale = fund.shareRatio / 100;
    const shareAmount = fund.equity * scale;

    const bondAmountRaw = fund.bonds.reduce((s, b) => s + b.amount, 0);
    const bondRate = weightedAvg(fund.bonds, 'rate');
    const bondMD = weightedAvg(fund.bonds, 'md');
    const bondAmount = bondAmountRaw * scale;
    const bondPvbp = pvbp(bondAmount, bondMD);

    const cdAmountRaw = fund.cds.reduce((s, c) => s + c.amount, 0);
    const cdRate = weightedAvg(fund.cds, 'rate');
    const cdMD = weightedAvg(fund.cds, 'md');
    const cdAmount = cdAmountRaw * scale;
    const cdPvbp = pvbp(cdAmount, cdMD);

    const totalAssetsRaw = bondAmountRaw + cdAmountRaw;
    const totalAssets = bondAmount + cdAmount;
    const leverage = shareAmount > 0 ? (totalAssets / shareAmount) * 100 - 100 : 0;

    const assetIncomeRaw = bondAmountRaw * bondRate / 100 + cdAmountRaw * cdRate / 100;
    const fundingCostRaw = Math.max(totalAssetsRaw - fund.equity, 0) * fund.repoRate / 100;
    const feeCostRaw = fund.equity * fund.feeBp / 10000;
    const netIncomeRaw = assetIncomeRaw - fundingCostRaw - feeCostRaw;
    const netIncome = netIncomeRaw * scale; // 수익자분 연간수익
    const expectedYield = shareAmount > 0 ? (netIncome / shareAmount) * 100 : 0;

    return { bondAmount, bondRate, bondMD, bondPvbp, cdAmount, cdRate, cdMD, cdPvbp, totalAssets, leverage, netIncome, expectedYield, shareAmount };
  }

  function fmt(n, d = 1) { return Number(n).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }

  let openDetailId = null;

  function render() {
    const state = loadState();
    const allFunds = state.funds || [];
    const funds = allFunds.filter((f) => !excludedIds.has(f.id));
    const table = document.getElementById('dashTable');

    if (allFunds.length === 0) {
      table.innerHTML = `<tbody><tr><td style="padding:40px;color:var(--ink-soft);">등록된 펀드가 없습니다. <a href="manager.html">운용사 펀드 내역 입력</a>에서 펀드를 만들어보세요.</td></tr></tbody>`;
      renderExcludedPanel(allFunds);
      return;
    }

    const rows = funds.map((f) => ({ fund: f, c: computeFund(f) }));

    const sums = {
      equity: 0, shareAmount: 0,
      bondAmount: 0, bondRateWeighted: 0, bondPvbp: 0,
      cdAmount: 0, cdRateWeighted: 0, cdPvbp: 0,
      totalAssets: 0, feeWeighted: 0, repoWeighted: 0, netIncome: 0,
    };
    rows.forEach(({ fund, c }) => {
      sums.equity += fund.equity;
      sums.shareAmount += c.shareAmount;
      sums.bondAmount += c.bondAmount;
      sums.bondRateWeighted += c.bondAmount * c.bondRate;
      sums.bondPvbp += c.bondPvbp;
      sums.cdAmount += c.cdAmount;
      sums.cdRateWeighted += c.cdAmount * c.cdRate;
      sums.cdPvbp += c.cdPvbp;
      sums.totalAssets += c.totalAssets;
      sums.feeWeighted += fund.equity * fund.feeBp;
      sums.repoWeighted += fund.equity * fund.repoRate;
      sums.netIncome += c.netIncome;
    });
    const avgBondRate = sums.bondAmount > 0 ? sums.bondRateWeighted / sums.bondAmount : 0;
    const avgCdRate = sums.cdAmount > 0 ? sums.cdRateWeighted / sums.cdAmount : 0;
    const avgLeverage = sums.shareAmount > 0 ? (sums.totalAssets / sums.shareAmount) * 100 - 100 : 0;
    const avgFee = sums.equity > 0 ? sums.feeWeighted / sums.equity : 0;
    const avgRepo = sums.equity > 0 ? sums.repoWeighted / sums.equity : 0;
    const avgYield = sums.shareAmount > 0 ? (sums.netIncome / sums.shareAmount) * 100 : 0;
    const avgShareRatio = sums.equity > 0 ? (sums.shareAmount / sums.equity) * 100 : 0;

    table.innerHTML = `
      <thead>
        <tr>
          <th rowspan="2">운용사</th>
          <th rowspan="2">펀드명</th>
          <th rowspan="2">규모(억)</th>
          <th rowspan="2">지분율</th>
          <th rowspan="2">수익자분(억)</th>
          <th colspan="4" class="group-bond">채권 정보 (수익자분)</th>
          <th colspan="4" class="group-cd">CD 정보 (수익자분)</th>
          <th rowspan="2">레버리지</th>
          <th rowspan="2">레포금리</th>
          <th rowspan="2">보수(bp)</th>
          <th rowspan="2">예상수익률</th>
          <th rowspan="2">연간수익(억)</th>
          <th rowspan="2">펀드명세</th>
          <th rowspan="2">관리</th>
        </tr>
        <tr>
          <th class="group-bond">금액(억)</th><th class="group-bond">금리</th><th class="group-bond">MD</th><th class="group-bond">PVBP</th>
          <th class="group-cd">금액(억)</th><th class="group-cd">금리</th><th class="group-cd">MD</th><th class="group-cd">PVBP</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(({ fund, c }) => `
          <tr>
            <td class="left">${fund.company}</td>
            <td class="left"><strong>${fund.fundName}</strong></td>
            <td>${fmt(fund.equity)}</td>
            <td>${fund.shareRatio}%</td>
            <td>${fmt(c.shareAmount)}</td>
            <td class="group-bond">${fmt(c.bondAmount)}</td>
            <td class="group-bond">${fmt(c.bondRate, 2)}%</td>
            <td class="group-bond">${fmt(c.bondMD, 2)}</td>
            <td class="group-bond">${fmt(c.bondPvbp, 2)}</td>
            <td class="group-cd">${fmt(c.cdAmount)}</td>
            <td class="group-cd">${fmt(c.cdRate, 2)}%</td>
            <td class="group-cd">${fmt(c.cdMD, 2)}</td>
            <td class="group-cd">${fmt(c.cdPvbp, 2)}</td>
            <td><strong>${fmt(c.leverage, 1)}%</strong></td>
            <td>${fmt(fund.repoRate, 2)}%</td>
            <td>${fund.feeBp}</td>
            <td><strong style="color:var(--teal);">${fmt(c.expectedYield, 2)}%</strong></td>
            <td>${fmt(c.netIncome, 1)}</td>
            <td><button class="link-btn" data-detail="${fund.id}">${openDetailId === fund.id ? '닫기 ▴' : '내역보기 ▾'}</button></td>
            <td><button class="del-link" data-exclude="${fund.id}">제외해보기</button></td>
          </tr>
          ${openDetailId === fund.id ? renderDetailRow(fund, c) : ''}
        `).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2" class="left">가중평균 / 합계</td>
          <td>${fmt(sums.equity)}</td>
          <td>${fmt(avgShareRatio, 1)}%</td>
          <td>${fmt(sums.shareAmount)}</td>
          <td class="group-bond">${fmt(sums.bondAmount)}</td>
          <td class="group-bond">${fmt(avgBondRate, 2)}%</td>
          <td class="group-bond">-</td>
          <td class="group-bond">${fmt(sums.bondPvbp, 2)}</td>
          <td class="group-cd">${fmt(sums.cdAmount)}</td>
          <td class="group-cd">${fmt(avgCdRate, 2)}%</td>
          <td class="group-cd">-</td>
          <td class="group-cd">${fmt(sums.cdPvbp, 2)}</td>
          <td>${fmt(avgLeverage, 1)}%</td>
          <td>${fmt(avgRepo, 2)}%</td>
          <td>${fmt(avgFee, 1)}</td>
          <td style="color:var(--teal);">${fmt(avgYield, 2)}%</td>
          <td>${fmt(sums.netIncome, 1)}</td>
          <td></td><td></td>
        </tr>
      </tfoot>
    `;

    table.querySelectorAll('[data-detail]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.detail;
        openDetailId = openDetailId === id ? null : id;
        render();
      });
    });
    table.querySelectorAll('[data-exclude]').forEach((btn) => {
      btn.addEventListener('click', () => {
        excludedIds.add(btn.dataset.exclude);
        saveExcluded(excludedIds);
        render();
      });
    });

    renderExcludedPanel(allFunds);
  }

  function specRow(it) {
    return `<tr><td>${it.name}</td><td>${it.amount}</td><td>${Number(it.rate).toFixed(3)}%</td><td>${Number(it.md).toFixed(2)}</td></tr>`;
  }

  function renderDetailRow(fund, c) {
    return `
      <tr class="detail-row">
        <td colspan="18">
          <div class="detail-grid">
            <div>
              <h4>📄 채권 명세 (펀드 전체 기준)</h4>
              <table class="mini">
                <thead><tr><th>종목명</th><th>금액(억)</th><th>금리</th><th>MD</th></tr></thead>
                <tbody>${fund.bonds.map(specRow).join('') || '<tr><td colspan="4">데이터 없음</td></tr>'}</tbody>
              </table>
            </div>
            <div>
              <h4>📄 CD 명세 (펀드 전체 기준)</h4>
              <table class="mini">
                <thead><tr><th>종목명</th><th>금액(억)</th><th>금리</th><th>MD</th></tr></thead>
                <tbody>${fund.cds.map(specRow).join('') || '<tr><td colspan="4">데이터 없음</td></tr>'}</tbody>
              </table>
            </div>
          </div>
          <div class="detail-footnote">
            수익자분 기준 · 채권 ${fmt(c.bondAmount)}억 + CD ${fmt(c.cdAmount)}억 = 총 ${fmt(c.totalAssets)}억 / 수익자분 ${fmt(c.shareAmount)}억
            → 레버리지 ${fmt(c.leverage, 1)}% · 예상수익률 ${fmt(c.expectedYield, 2)}% · 연간수익 ${fmt(c.netIncome, 1)}억원
          </div>
        </td>
      </tr>
    `;
  }

  function renderExcludedPanel(allFunds) {
    const panel = document.getElementById('excludedPanel');
    const excluded = allFunds.filter((f) => excludedIds.has(f.id));
    if (excluded.length === 0) { panel.style.display = 'none'; panel.innerHTML = ''; return; }
    panel.style.display = 'block';
    panel.innerHTML = `
      <strong>🧪 제외해본 펀드 (테스트, 위 집계에서 제외됨 — 운용사 데이터는 그대로 유지)</strong><br>
      ${excluded.map((f) => `
        <span class="excluded-chip">${f.company} · ${f.fundName}
          <button class="restore-link" data-restore="${f.id}">복원</button>
        </span>
      `).join('')}
    `;
    panel.querySelectorAll('[data-restore]').forEach((btn) => {
      btn.addEventListener('click', () => {
        excludedIds.delete(btn.dataset.restore);
        saveExcluded(excludedIds);
        render();
      });
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', render);
  document.getElementById('closeBtn').addEventListener('click', () => {
    window.close();
    setTimeout(() => { if (!window.closed) history.back(); }, 150);
  });

  // 화면에 보이는 대시보드 표를 그대로 엑셀(xlsx)로 저장
  document.getElementById('exportExcelBtn').addEventListener('click', () => {
    try {
      const wb = XLSX.utils.table_to_book(document.getElementById('dashTable'), { sheet: '수익자통합집계' });
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      XLSX.writeFile(wb, `수익자통합집계_${today}.xlsx`);
    } catch (e) {
      alert('엑셀 저장에 실패했습니다: ' + e.message);
    }
  });

  // 대시보드 합계(가중평균/합계 행)를 레포펀드 시뮬레이터에 기본값으로 넘겨서 새 창으로 연다.
  // ⚠️ 시뮬레이터(apps/repo-fund-simulator.html)가 실제로 어떤 파라미터/키를 읽는지는
  // 아직 확인하지 못해 URL 쿼리스트링 + localStorage 두 가지로 우선 넘겨두었습니다.
  // 시뮬레이터 파일을 공유해주시면 정확한 필드명으로 맞춰드릴 수 있어요.
  document.getElementById('gotoSimulatorBtn').addEventListener('click', () => {
    const state = loadState();
    const funds = (state.funds || []).filter((f) => !excludedIds.has(f.id));
    if (funds.length === 0) { alert('집계할 펀드가 없습니다.'); return; }
    const rows = funds.map((f) => ({ fund: f, c: computeFund(f) }));
    let bondAmt = 0, bondRateW = 0, cdAmt = 0, cdRateW = 0, shareAmt = 0, totalAssets = 0;
    rows.forEach(({ fund, c }) => {
      bondAmt += c.bondAmount; bondRateW += c.bondAmount * c.bondRate;
      cdAmt += c.cdAmount; cdRateW += c.cdAmount * c.cdRate;
      shareAmt += c.shareAmount; totalAssets += c.totalAssets;
    });
    const payload = {
      source: 'aimi-fund-dashboard',
      equity: Math.round(shareAmt * 10) / 10,
      bondAmount: Math.round(bondAmt * 10) / 10,
      bondRate: bondAmt > 0 ? Math.round((bondRateW / bondAmt) * 1000) / 1000 : 0,
      cdAmount: Math.round(cdAmt * 10) / 10,
      cdRate: cdAmt > 0 ? Math.round((cdRateW / cdAmt) * 100) / 100 : 0,
      leverage: shareAmt > 0 ? Math.round(((totalAssets / shareAmt) * 100 - 100) * 10) / 10 : 0,
    };
    try { localStorage.setItem('aimi_repofund_prefill', JSON.stringify(payload)); } catch (e) {}
    const params = new URLSearchParams({
      prefill: '1', equity: payload.equity, bondAmount: payload.bondAmount, bondRate: payload.bondRate,
      cdAmount: payload.cdAmount, cdRate: payload.cdRate, leverage: payload.leverage,
    });
    window.open(`../apps/repo-fund-simulator.html?${params.toString()}`, '_blank');
  });

  render();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) render(); });
</script>
</body>
</html>
