<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이종채권 Yield Curve 변화도 — AI 마켓 인사이트</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f4f5f7;
    color: #1f2430;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 18px 40px; }

  .page-header-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  .page-header-row h1 { font-size: 18px; margin: 0; }
  .close-btn {
    border: 1px solid #d7dae0; background: #fff; color: #374151;
    padding: 6px 14px; border-radius: 7px; font-size: 13px; cursor: pointer;
  }
  .close-btn:hover { background: #f3f4f6; }

  .panel {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }

  .transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .play-btn {
    border: none; background: #16305c; color: #fff; width: 42px; height: 42px;
    border-radius: 50%; font-size: 16px; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn:hover { background: #0f2247; }
  .speed-group { display: flex; gap: 4px; }
  .speed-btn {
    border: 1px solid #d7dae0; background: #fff; color: #374151;
    padding: 6px 10px; border-radius: 7px; font-size: 12.5px; cursor: pointer;
  }
  .speed-btn.is-active { background: #16305c; color: #fff; border-color: #16305c; }
  .month-slider { flex: 1; min-width: 160px; }
  .month-label {
    font-size: 18px; font-weight: 700; color: #16305c; min-width: 108px; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .range-row {
    display: flex; align-items: center; gap: 18px; margin-top: 10px;
    font-size: 12.5px; color: #4b5563;
  }
  .range-row label { display: flex; align-items: center; gap: 6px; }
  .range-row select {
    border: 1px solid #d7dae0; border-radius: 6px; padding: 4px 8px; font-size: 12.5px; color: #1f2430;
  }
  .hint-note {
    margin-left: auto; text-align: right; line-height: 1.55;
    font-size: 12.5px; font-style: italic; font-weight: 400; color: #16305c;
  }
  .hint-note .hint-en { display: block; font-size: 11.5px; font-style: normal; font-weight: 400; color: #374151; }

  .toggle-row {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef0f2;
    font-size: 12.5px; color: #4b5563;
  }
  .toggle-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

  .chart-canvas-box { position: relative; height: 420px; }
  .bottom-canvas-box { position: relative; height: 200px; cursor: pointer; }

  .bottom-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bottom-toolbar .seg-btn {
    border: 1px solid #d7dae0; background: #fff; color: #374151;
    padding: 6px 13px; border-radius: 7px; font-size: 12.5px; cursor: pointer;
  }
  .bottom-toolbar .seg-btn.is-active { background: #e3f5ee; color: #1f8266; border-color: #8fd9bd; font-weight: 700; }

  .sub-controls { margin-bottom: 10px; }
  .indicator-checklist {
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    font-size: 12.5px; color: #374151;
  }
  .indicator-checklist label { display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  .indicator-checklist .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .spread-controls { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #4b5563; }
  .spread-controls select {
    border: 1px solid #d7dae0; border-radius: 6px; padding: 4px 8px; font-size: 12.5px; color: #1f2430;
  }

  .loading, .error { text-align: center; color: #9ca3af; font-size: 13px; padding: 60px 0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-header-row">
    <h1>📈 이종채권 Yield Curve 변화도</h1>
    <button class="close-btn" id="close-btn">✕ 닫기</button>
  </div>

  <div id="loading" class="loading">데이터를 불러오는 중…</div>

  <div id="app" style="display:none;">
    <div class="panel">
      <div class="transport">
        <button class="play-btn" id="play-btn">▶</button>
        <div class="speed-group" id="speed-group">
          <button class="speed-btn" data-speed="slow">느리게</button>
          <button class="speed-btn is-active" data-speed="normal">보통</button>
          <button class="speed-btn" data-speed="fast">빠르게</button>
        </div>
        <input type="range" class="month-slider" id="month-slider" min="0" max="0" value="0" step="1">
        <span class="month-label" id="month-label">-</span>
      </div>
      <div class="range-row" id="range-row">
        <label>시작 <select id="range-start"></select></label>
        <label>끝 <select id="range-end"></select></label>
        <span class="hint-note">
          百聞이 不如一見 · 자꾸 보다 보면 아이디어가 떠오릅니다
          <span class="hint-en">A picture is worth a thousand words — a moving one, even more.</span>
        </span>
      </div>
      <div class="toggle-row">
        <label><input type="checkbox" id="ghost-toggle" checked> 이전 달 잔상 표시</label>
        <label><input type="checkbox" id="ref-toggle"> 전년 동월 커브 비교</label>
        <label><input type="checkbox" id="yearend-toggle"> 전년말 커브 비교</label>
      </div>
    </div>

    <div class="panel">
      <div class="chart-canvas-box">
        <canvas id="curve-chart"></canvas>
      </div>
    </div>

    <div class="panel">
      <div class="bottom-toolbar">
        <button class="seg-btn is-active" data-mode="multi">지표 추이</button>
        <button class="seg-btn" data-mode="spread">스프레드</button>
      </div>

      <div id="multi-controls" class="sub-controls">
        <div id="indicator-checklist" class="indicator-checklist"></div>
      </div>

      <div id="spread-controls" class="sub-controls spread-controls" style="display:none;">
        <label>A <select id="spread-a"></select></label>
        <span>−</span>
        <label>B <select id="spread-b"></select></label>
      </div>

      <div class="bottom-canvas-box">
        <canvas id="bottom-chart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://hnxvsopwxiamexnxczhj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhueHZzb3B3eGlhbWV4bnhjemhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjAzNjksImV4cCI6MjA5NzgzNjM2OX0._7LzP4rrjM1F06Dya_vX_kTA4t1jw7DlR6ExWlvhxak";

  // 위쪽 커브의 기본 구성 (사용자가 추가/삭제/순서변경 가능 — CURVE_TENORS가 실제 표시값,
  // DEFAULT_TENORS는 애니메이션 재생 가능한 달(MONTHS)을 정하는 기준으로만 사용)
  const DEFAULT_TENORS = ['기준금리', 'CD 91D', '산금 6M', '산금 1Y', '산금 2Y', '국고 3Y', '국고 5Y', '국고 10Y'];
  let CURVE_TENORS = [...DEFAULT_TENORS];

  const PALETTE = ['#16305c', '#0f7a6b', '#b7791f', '#7f77dd', '#c0392b', '#2b6fd9', '#d4537e', '#556b2f', '#8e44ad', '#e67e22'];

  const SPEED_MS = { slow: 900, normal: 450, fast: 180 };
  let currentSpeed = 'normal';
  let playing = false;
  let timer = null;

  let MONTHS = [];          // ['2001-01', ...] (커브 8개 지표가 모두 있는 달만)
  let MONTH_DATES = [];     // 표시용 실제 날짜 (해당 월의 마지막 거래일)
  let ALL_INDICATORS = [];  // 화면에서 선택 가능한 전체 지표 목록 (표시 순서)
  let DATA = {};            // DATA[indicator] = [value|null, ...] (MONTHS 순서)
  let curIdx = 0;
  let rangeStart = 0;
  let rangeEnd = 0;

  let bottomMode = 'multi';                 // 'multi' | 'spread'
  let selectedIndicators = new Set(['기준금리']);
  let spreadA = '산금 6M';
  let spreadB = '기준금리';

  let curveChart = null;
  let bottomChart = null;

  function shortLabel(name) { return name.replace(/\s+/g, ''); }

  async function fetchRpc(fnName) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: '{}',
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function fmtMonthLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
  }

  async function loadData() {
    const rows = await fetchRpc('get_yield_curve_monthly');

    const byIndicatorMonth = {};
    const indicatorSet = new Set();
    const monthSet = new Set();

    rows.forEach((r) => {
      const monthKey = r.month_date.slice(0, 7);
      indicatorSet.add(r.indicator);
      if (!byIndicatorMonth[r.indicator]) byIndicatorMonth[r.indicator] = {};
      byIndicatorMonth[r.indicator][monthKey] = { value: Number(r.value), date: r.month_date };
      if (DEFAULT_TENORS.includes(r.indicator)) monthSet.add(monthKey);
    });

    MONTHS = Array.from(monthSet).sort();
    // 기준이 되는 8개 지표가 모두 존재하는 달만 애니메이션 재생 대상으로 사용
    MONTHS = MONTHS.filter((m) => DEFAULT_TENORS.every((t) => byIndicatorMonth[t] && byIndicatorMonth[t][m] !== undefined));
    MONTH_DATES = MONTHS.map((m) => byIndicatorMonth['기준금리'][m].date);

    const extra = Array.from(indicatorSet).filter((x) => !DEFAULT_TENORS.includes(x)).sort();
    ALL_INDICATORS = [...DEFAULT_TENORS, ...extra];

    ALL_INDICATORS.forEach((t) => {
      DATA[t] = MONTHS.map((m) => (byIndicatorMonth[t] && byIndicatorMonth[t][m]) ? byIndicatorMonth[t][m].value : null);
    });
  }

  function globalYRange(fromIdx, toIdx) {
    const s = fromIdx == null ? 0 : fromIdx;
    const e = toIdx == null ? MONTHS.length - 1 : toIdx;
    let min = Infinity, max = -Infinity;
    CURVE_TENORS.forEach((t) => {
      for (let i = s; i <= e; i++) {
        const v = DATA[t][i];
        if (v == null) continue;
        if (v < min) min = v;
        if (v > max) max = v;
      }
    });
    const pad = (max - min) * 0.05 || 0.3;
    return { min: Math.max(0, min - pad), max: max + pad };
  }

  function curveDataFor(idx) {
    return CURVE_TENORS.map((t) => DATA[t][idx]);
  }

  function sameMonthLastYearIdx(idx) {
    const target = MONTHS[idx];
    const y = Number(target.slice(0, 4)) - 1;
    const m = target.slice(5, 7);
    return MONTHS.indexOf(`${y}-${m}`);
  }

  function yearEndLastYearIdx(idx) {
    const target = MONTHS[idx];
    const y = Number(target.slice(0, 4)) - 1;
    let lastIdx = -1;
    MONTHS.forEach((m, i) => { if (m.startsWith(String(y) + '-')) lastIdx = i; });
    return lastIdx;
  }

  const curveValueLabelPlugin = {
    id: 'curveValueLabel',
    afterDatasetsDraw(chart) {
      const dsIndex = 3; // '현재' 데이터셋
      const meta = chart.getDatasetMeta(dsIndex);
      if (!meta || meta.hidden) return;
      const data = chart.data.datasets[dsIndex].data;
      const { ctx, chartArea } = chart;
      ctx.save();
      ctx.font = 'bold 11.5px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = '#16305c';
      ctx.textAlign = 'center';
      meta.data.forEach((point, i) => {
        const v = data[i];
        if (v == null) return;
        const text = v.toFixed(2) + '%';
        const y = Math.max(point.y - 12, (chartArea && chartArea.top) ? chartArea.top + 10 : point.y - 12);
        ctx.fillText(text, point.x, y);
      });
      ctx.restore();
    },
  };

  function buildCurveChart() {
    const yRange = globalYRange();
    const ctx = document.getElementById('curve-chart');

    curveChart = new Chart(ctx, {
      type: 'line',
      plugins: [curveValueLabelPlugin],
      data: {
        labels: CURVE_TENORS.map(shortLabel),
        datasets: [
          {
            label: '전년말',
            data: [],
            borderColor: 'rgba(183,121,31,0.55)',
            backgroundColor: 'rgba(183,121,31,0.55)',
            borderDash: [3, 3],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.15,
            hidden: true,
          },
          {
            label: '전년 동월',
            data: [],
            borderColor: 'rgba(127,119,221,0.6)',
            backgroundColor: 'rgba(127,119,221,0.6)',
            borderDash: [5, 3],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.15,
            hidden: true,
          },
          {
            label: '이전 달',
            data: [],
            borderColor: 'rgba(15,122,107,0.85)',
            backgroundColor: 'rgba(15,122,107,0.85)',
            borderDash: [2, 2],
            borderWidth: 2.4,
            pointRadius: 4,
            pointStyle: 'rectRot',
            tension: 0.15,
          },
          {
            label: '현재',
            data: [],
            borderColor: '#16305c',
            backgroundColor: '#16305c',
            borderWidth: 2.6,
            pointRadius: 4,
            pointBackgroundColor: '#16305c',
            tension: 0.15,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 350, easing: 'easeOutQuad' },
        layout: { padding: { top: 18 } },
        plugins: {
          legend: {
            display: true, position: 'top',
            labels: { usePointStyle: true, boxWidth: 20, boxHeight: 8, font: { size: 12 } },
            // [요구사항 7] 범례를 직접 클릭해도 위쪽 체크박스와 항상 같은 상태를 갖도록,
            // 기본 토글 동작 대신 체크박스를 토글하고 그걸 기준으로 다시 그린다.
            onClick: (e, legendItem) => {
              const map = { 0: 'yearend-toggle', 1: 'ref-toggle', 2: 'ghost-toggle' };
              const cbId = map[legendItem.datasetIndex];
              if (!cbId) return; // '현재'는 항상 표시, 토글 불가
              const cb = document.getElementById(cbId);
              cb.checked = !cb.checked;
              render();
            },
          },
          tooltip: {
            callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y.toFixed(3)}%` },
          },
        },
        scales: {
          x: { ticks: { font: { size: 12.5 } } },
          y: {
            min: yRange.min, max: yRange.max,
            title: { display: true, text: '금리(%)' },
            ticks: { stepSize: 0.5, font: { size: 11.5 } },
          },
        },
      },
    });
  }

  const hoverLinePlugin = {
    id: 'hoverLine',
    afterEvent(chart, args) {
      const e = args.event;
      const area = chart.chartArea;
      if (!area) return;
      if (e.type === 'mousemove' && e.y >= area.top && e.y <= area.bottom && e.x >= area.left && e.x <= area.right) {
        chart._hoverY = e.y;
        args.changed = true;
      } else if (e.type === 'mouseout' || e.type === 'mouseleave') {
        chart._hoverY = null;
        args.changed = true;
      }
    },
    afterDraw(chart) {
      const y = chart._hoverY;
      if (y == null) return;
      const { ctx, chartArea, scales } = chart;
      const value = scales.y.getValueForPixel(y);
      if (value == null) return;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y);
      ctx.lineTo(chartArea.right, y);
      ctx.strokeStyle = 'rgba(31,36,48,0.45)';
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1;
      ctx.stroke();

      const text = value.toFixed(3);
      ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
      const textWidth = ctx.measureText(text).width;
      const boxX = chartArea.right - textWidth - 10;
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(31,36,48,0.85)';
      ctx.fillRect(boxX - 4, y - 9, textWidth + 8, 16);
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillText(text, boxX, y);
      ctx.restore();
    },
  };
  Chart.register(hoverLinePlugin);

  // 현재 위치(재생 커서) 마커마다 값 라벨을 붙여준다. _isMarker 플래그가 붙은 데이터셋만 대상으로 함.
  const bottomCurrentLabelPlugin = {
    id: 'bottomCurrentLabel',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea } = chart;
      chart.data.datasets.forEach((ds, dsIndex) => {
        if (!ds._isMarker) return;
        const meta = chart.getDatasetMeta(dsIndex);
        if (!meta || !meta.data || !meta.data.length) return;
        const point = meta.data[0];
        const raw = ds.data[0];
        if (!point || raw == null || raw.y == null) return;

        const text = raw.y.toFixed(3);
        ctx.save();
        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
        const textWidth = ctx.measureText(text).width;
        let x = point.x + 9;
        if (x + textWidth + 6 > chartArea.right) x = point.x - textWidth - 15;
        let y = point.y - 14;
        if (y - 9 < chartArea.top) y = point.y + 16;

        ctx.fillStyle = ds.borderColor || '#16305c';
        ctx.fillRect(x - 3, y - 9, textWidth + 6, 18);
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText(text, x, y);
        ctx.restore();
      });
    },
  };

  function buildBottomChart() {
    const ctx = document.getElementById('bottom-chart');
    bottomChart = new Chart(ctx, {
      type: 'line',
      plugins: [bottomCurrentLabelPlugin],
      data: { datasets: [] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: {
            display: true, position: 'top',
            labels: {
              usePointStyle: true, boxWidth: 16, boxHeight: 8, font: { size: 11.5 },
              filter: (item) => !item.text.startsWith('_'), // 마커 데이터셋은 범례에서 숨김
            },
          },
          tooltip: { enabled: false },
        },
        scales: {
          x: {
            type: 'time',
            time: { displayFormats: { year: 'yyyy' } },
            ticks: { font: { size: 10.5 }, maxRotation: 0 },
          },
          y: { ticks: { font: { size: 10.5 } } },
        },
      },
    });
  }

  // 지표 선택 체크리스트 렌더링 (요구사항 4, 5)
  function renderIndicatorChecklist() {
    const box = document.getElementById('indicator-checklist');
    box.innerHTML = ALL_INDICATORS.map((name, i) => {
      const color = PALETTE[i % PALETTE.length];
      const checked = selectedIndicators.has(name) ? 'checked' : '';
      return `
        <label>
          <input type="checkbox" data-indicator="${name}" ${checked}>
          <span class="swatch" style="background:${color}"></span>
          ${shortLabel(name)}
        </label>`;
    }).join('');

    box.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener('change', () => {
        const name = cb.getAttribute('data-indicator');
        if (cb.checked) selectedIndicators.add(name); else selectedIndicators.delete(name);
        refreshBottomSeries();
      });
    });
  }

  function populateSpreadSelects() {
    const aSel = document.getElementById('spread-a');
    const bSel = document.getElementById('spread-b');
    const opts = ALL_INDICATORS.map((n) => `<option value="${n}">${shortLabel(n)}</option>`).join('');
    aSel.innerHTML = opts;
    bSel.innerHTML = opts;
    aSel.value = spreadA;
    bSel.value = spreadB;
    aSel.addEventListener('change', () => { spreadA = aSel.value; refreshBottomSeries(); });
    bSel.addEventListener('change', () => { spreadB = bSel.value; refreshBottomSeries(); });
  }

  // 위에서 고른 시작~끝 구간만 슬라이스
  function sliceRange(arr) {
    return arr.slice(rangeStart, rangeEnd + 1);
  }

  function refreshBottomSeries() {
    const dates = sliceRange(MONTH_DATES);
    const datasets = [];

    if (bottomMode === 'multi') {
      ALL_INDICATORS.forEach((name, i) => {
        if (!selectedIndicators.has(name)) return;
        const color = PALETTE[i % PALETTE.length];
        const series = sliceRange(DATA[name]);
        datasets.push({
          label: shortLabel(name),
          data: dates.map((d, j) => (series[j] == null ? null : { x: d, y: series[j] })),
          borderColor: color, backgroundColor: color,
          borderWidth: 1.5, pointRadius: 0, tension: 0.05, spanGaps: true,
        });
        datasets.push({
          label: '_marker_' + name,
          data: [], type: 'scatter', pointStyle: 'circle', pointRadius: 5,
          backgroundColor: color, borderColor: '#fff', borderWidth: 2, showLine: false, _isMarker: true,
        });
      });
    } else {
      const seriesA = DATA[spreadA], seriesB = DATA[spreadB];
      const spreadSeries = MONTHS.map((_, i) => (seriesA[i] == null || seriesB[i] == null) ? null : seriesA[i] - seriesB[i]);
      const sliced = sliceRange(spreadSeries);
      datasets.push({
        label: `${shortLabel(spreadA)} − ${shortLabel(spreadB)}`,
        data: dates.map((d, j) => (sliced[j] == null ? null : { x: d, y: sliced[j] })),
        borderColor: '#0f7a6b', backgroundColor: 'rgba(15,122,107,0.12)',
        borderWidth: 1.4, pointRadius: 0, tension: 0.05, fill: true, spanGaps: true,
      });
      datasets.push({
        label: '_marker_spread', data: [], type: 'scatter', pointStyle: 'circle', pointRadius: 5,
        backgroundColor: '#0f7a6b', borderColor: '#fff', borderWidth: 2, showLine: false, _isMarker: true,
      });
    }

    bottomChart.data.datasets = datasets;
    updateBottomMarker();
  }

  function updateBottomMarker() {
    if (bottomIdxOutOfRange()) return;
    if (bottomMode === 'multi') {
      ALL_INDICATORS.forEach((name) => {
        if (!selectedIndicators.has(name)) return;
        const markerDs = bottomChart.data.datasets.find((d) => d.label === '_marker_' + name);
        const v = DATA[name][curIdx];
        if (markerDs) markerDs.data = v == null ? [] : [{ x: MONTH_DATES[curIdx], y: v }];
      });
    } else {
      const a = DATA[spreadA][curIdx], b = DATA[spreadB][curIdx];
      const markerDs = bottomChart.data.datasets.find((d) => d.label === '_marker_spread');
      if (markerDs) markerDs.data = (a == null || b == null) ? [] : [{ x: MONTH_DATES[curIdx], y: a - b }];
    }
    bottomChart.update('none');
  }

  function bottomIdxOutOfRange() {
    return !bottomChart || curIdx < rangeStart || curIdx > rangeEnd;
  }

  function render() {
    document.getElementById('month-slider').value = curIdx;
    document.getElementById('month-label').textContent = fmtMonthLabel(MONTH_DATES[curIdx]);

    curveChart.data.datasets[2].data = curIdx > 0 && document.getElementById('ghost-toggle').checked
      ? curveDataFor(curIdx - 1) : [];
    curveChart.data.datasets[3].data = curveDataFor(curIdx);

    if (document.getElementById('ref-toggle').checked) {
      const refIdx = sameMonthLastYearIdx(curIdx);
      curveChart.data.datasets[1].data = refIdx >= 0 ? curveDataFor(refIdx) : [];
      curveChart.data.datasets[1].hidden = refIdx < 0;
    } else {
      curveChart.data.datasets[1].hidden = true;
    }

    if (document.getElementById('yearend-toggle').checked) {
      const yeIdx = yearEndLastYearIdx(curIdx);
      curveChart.data.datasets[0].data = yeIdx >= 0 ? curveDataFor(yeIdx) : [];
      curveChart.data.datasets[0].hidden = yeIdx < 0;
    } else {
      curveChart.data.datasets[0].hidden = true;
    }

    curveChart.update();
    updateBottomMarker();
  }

  function stepForward() {
    curIdx++;
    if (curIdx > rangeEnd) {
      curIdx = rangeEnd;
      stopPlay();
    }
    render();
  }

  function stopPlay() {
    playing = false;
    clearInterval(timer);
    document.getElementById('play-btn').textContent = '▶';
  }

  function startPlay() {
    if (curIdx < rangeStart || curIdx >= rangeEnd) curIdx = rangeStart;
    playing = true;
    document.getElementById('play-btn').textContent = '❚❚';
    timer = setInterval(stepForward, SPEED_MS[currentSpeed]);
  }

  function populateRangeSelects(defaultStartMonth) {
    const startSel = document.getElementById('range-start');
    const endSel = document.getElementById('range-end');
    const opts = MONTHS.map((m, i) => `<option value="${i}">${fmtMonthLabel(MONTH_DATES[i])}</option>`).join('');
    startSel.innerHTML = opts;
    endSel.innerHTML = opts;
    const defaultStartIdx = defaultStartMonth ? Math.max(0, MONTHS.indexOf(defaultStartMonth)) : 0;
    startSel.value = defaultStartIdx;
    endSel.value = MONTHS.length - 1;
    return defaultStartIdx;
  }

  function applyRange() {
    const startSel = document.getElementById('range-start');
    const endSel = document.getElementById('range-end');
    let s = parseInt(startSel.value, 10);
    let e = parseInt(endSel.value, 10);
    if (s > e) { [s, e] = [e, s]; }
    rangeStart = s;
    rangeEnd = e;
    startSel.value = s;
    endSel.value = e;

    const slider = document.getElementById('month-slider');
    slider.min = rangeStart;
    slider.max = rangeEnd;
    if (curIdx < rangeStart || curIdx > rangeEnd) {
      curIdx = rangeStart;
    }

    // [요구사항 3] 선택 구간 안에서만 y축을 다시 잡아 변동폭이 작아도 잘 보이게 함
    const yRange = globalYRange(rangeStart, rangeEnd);
    curveChart.options.scales.y.min = yRange.min;
    curveChart.options.scales.y.max = yRange.max;

    // [요구사항 2] 아래 추이 차트도 같은 구간만 보이게
    refreshBottomSeries();

    stopPlay();
    render();
  }

  function initControls() {
    document.getElementById('play-btn').addEventListener('click', () => {
      if (playing) stopPlay(); else startPlay();
    });

    document.querySelectorAll('.speed-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        currentSpeed = btn.getAttribute('data-speed');
        if (playing) { stopPlay(); startPlay(); }
      });
    });

    // [요구사항 1] 시작 기본값 2010년 1월
    const defaultStartIdx = populateRangeSelects('2010-01');
    rangeStart = defaultStartIdx;
    rangeEnd = MONTHS.length - 1;
    document.getElementById('range-start').addEventListener('change', applyRange);
    document.getElementById('range-end').addEventListener('change', applyRange);

    const slider = document.getElementById('month-slider');
    slider.min = rangeStart;
    slider.max = rangeEnd;
    slider.addEventListener('input', (e) => {
      curIdx = parseInt(e.target.value, 10);
      stopPlay();
      render();
    });

    ['ghost-toggle', 'ref-toggle', 'yearend-toggle'].forEach((id) => {
      document.getElementById(id).addEventListener('change', render);
    });

    document.querySelectorAll('.bottom-toolbar .seg-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bottom-toolbar .seg-btn').forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        bottomMode = btn.getAttribute('data-mode');
        document.getElementById('multi-controls').style.display = bottomMode === 'multi' ? 'block' : 'none';
        document.getElementById('spread-controls').style.display = bottomMode === 'spread' ? 'flex' : 'none';
        refreshBottomSeries();
      });
    });

    renderIndicatorChecklist();
    populateSpreadSelects();

    // 아래 추이 차트를 클릭하면 그 시점으로 위 재생바를 이동시킨다.
    document.getElementById('bottom-chart').addEventListener('click', (evt) => {
      const rect = bottomChart.canvas.getBoundingClientRect();
      const x = evt.clientX - rect.left;
      const clickedTime = bottomChart.scales.x.getValueForPixel(x);
      if (clickedTime == null) return;

      let bestIdx = rangeStart, bestDiff = Infinity;
      for (let i = rangeStart; i <= rangeEnd; i++) {
        const t = new Date(MONTH_DATES[i] + 'T00:00:00').getTime();
        const diff = Math.abs(t - clickedTime);
        if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
      }
      curIdx = bestIdx;
      stopPlay();
      render();
    });

    document.getElementById('close-btn').addEventListener('click', () => window.close());
  }

  async function main() {
    try {
      await loadData();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      buildCurveChart();
      buildBottomChart();
      initControls();

      curIdx = rangeEnd; // 선택 구간의 마지막 달부터 시작
      const yRange = globalYRange(rangeStart, rangeEnd);
      curveChart.options.scales.y.min = yRange.min;
      curveChart.options.scales.y.max = yRange.max;

      refreshBottomSeries();
      render();
    } catch (err) {
      console.error(err);
      document.getElementById('loading').textContent = '데이터를 불러오지 못했습니다: ' + err.message;
    }
  }

  main();
})();
</script>
</body>
</html>
