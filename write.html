<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리서치 자료 등록 - AI 마켓 브리핑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='8' height='22' rx='2' fill='%2316305c'/%3E%3Crect x='12' y='2' width='8' height='28' rx='2' fill='%23b7791f'/%3E%3Crect x='22' y='12' width='8' height='18' rx='2' fill='%230f7a6b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  .wrap { max-width: 600px; margin: 0 auto; padding: 20px; }
  .write-box { padding: 24px 0; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .field input[type="text"], .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-s); font-family: inherit; font-size: 14px; color: var(--text);
    box-sizing: border-box;
  }
  .field textarea { resize: vertical; min-height: 120px; }
  .field input[type="file"] { font-size: 13px; }
  .submit-btn {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-s); font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }
  .status-msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .status-msg.ok { color: var(--teal); font-weight: 600; }
  .status-msg.err { color: var(--up); font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <header style="padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;">
    <h1 style="font-size: 20px; margin: 0 0 6px;">리서치 자료 등록</h1>
    <p style="font-size: 13px; color: var(--text-faint); margin: 0;">
      <a href="index.html" style="color: var(--accent); text-decoration: none;">← 메인으로 돌아가기</a>
    </p>
  </header>

  <!-- ===== 등록 폼 ===== -->
  <section class="write-box">
    <div class="field">
      <label for="f-title">제목</label>
      <input type="text" id="f-title" placeholder="예: 국고채 3년물, 연내 추가 인하 반영 속도">
    </div>

    <div class="field">
      <label for="f-summary">요약</label>
      <textarea id="f-summary" placeholder="한 줄~몇 줄 요약을 입력하세요"></textarea>
    </div>

    <div class="field">
      <label for="f-file">첨부파일 (pdf / html / xlsx 등)</label>
      <input type="file" id="f-file">
    </div>

    <button class="submit-btn" id="submit-btn">등록하기</button>
    <div class="status-msg" id="submit-status"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hnxvsopwxiamexnxczhj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1_9-bKTcV3sBQkv10ru__w_iW-51pKt';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const BUCKET = 'files';

  const submitBtn = document.getElementById('submit-btn');
  const submitStatus = document.getElementById('submit-status');

  submitBtn.addEventListener('click', async () => {
    const title = document.getElementById('f-title').value.type?.trim() || document.getElementById('f-title').value.trim();
    const summary = document.getElementById('f-summary').value.trim();
    const fileInput = document.getElementById('f-file');
    const file = fileInput.files[0];

    if (!title || !summary) {
      submitStatus.textContent = '제목과 요약을 모두 입력해주세요.';
      submitStatus.className = 'status-msg err';
      return;
    }

    submitBtn.disabled = true;
    submitStatus.textContent = '등록 중입니다…';
    submitStatus.className = 'status-msg';

    try {
      let file_url = null, file_name = null, file_type = null, file_path = null;

      if (file) {
        const normalizedName = file.name.normalize('NFC');
        const extMatch = normalizedName.match(/\.[^.]+$/);
        const ext = extMatch ? extMatch[0].toLowerCase() : '';
        file_path = `${Date.now()}${ext}`;
        
        const { error: upErr } = await client.storage.from(BUCKET).upload(file_path, file);
        if (upErr) throw upErr;
        
        const { data: pub } = client.storage.from(BUCKET).getPublicUrl(file_path);
        file_url = pub.publicUrl;
        file_name = normalizedName;
        file_type = normalizedName.includes('.') ? normalizedName.split('.').pop().toLowerCase() : null;
      }

      const { error: insErr } = await client.from('research_reports').insert({
        title, summary, file_url, file_name, file_type, file_path,
      });
      if (insErr) throw insErr;

      submitStatus.textContent = '성공적으로 등록되었습니다!';
      submitStatus.className = 'status-msg ok';
      
      // 입력폼 초기화
      document.getElementById('f-title').value = '';
      document.getElementById('f-summary').value = '';
      fileInput.value = '';
      
    } catch (err) {
      console.error(err);
      submitStatus.textContent = `등록 실패: ${err.message || err}`;
      submitStatus.className = 'status-msg err';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
