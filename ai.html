<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="금리·채권·공모주 데이터를 참고해 답변하는 AI 애널리스트">
<link rel="stylesheet" href="css/style.css">
<style>
  .ai-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
  .ai-intro { font-size: 15px; color: var(--text-muted, #4b5563); margin: 20px 0 14px; line-height: 1.7; }
  .ai-perks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .ai-perk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #16305c; background: #eaf0fb; padding: 6px 11px; border-radius: 8px; font-weight: 500; }
  .ai-notice { font-size: 12px; color: #9ca3af; margin-bottom: 18px; }
  .ai-header .wrap { padding-top: 20px; padding-bottom: 20px; }
  .ai-back { display: inline-block; font-size: 13px; color: var(--text-faint, #6b7280); margin-bottom: 14px; }
  .ai-back:hover { color: var(--accent, #16305c); }
  .ai-title-row { display: flex; align-items: center; gap: 16px; }
  .ai-hero-visual { width: 110px; height: 54px; flex: none; display: block; }
  .ai-title { font-size: 28px; font-weight: 800; color: #16305c; margin: 0 0 4px; letter-spacing: -0.02em; }
  .ai-subtitle { font-size: 14.5px; color: #6b7280; margin: 0; line-height: 1.5; }
  .ai-model-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #0f7a6b; background: #e1f3ef; padding: 3px 10px; border-radius: 999px; margin-top: 8px; font-weight: 600; }
  .ai-model-dot { width: 6px; height: 6px; border-radius: 50%; background: #0f7a6b; flex: none; }
  @media (max-width: 480px) {
    .ai-hero-visual { width: 76px; height: 37px; }
    .ai-title { font-size: 22px; }
    .ai-subtitle { font-size: 13px; }
  }
  .ai-chat { display: flex; flex-direction: column; gap: 14px; margin-bottom: 90px; }
  .ai-msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .ai-msg.user { align-self: flex-end; background: #16305c; color: #fff; border-bottom-right-radius: 4px; }
  .ai-msg.bot { align-self: flex-start; background: #f3f4f6; color: #111827; border-bottom-left-radius: 4px; }
  .ai-msg.bot.pending { color: #6b7280; font-style: normal; display: flex; align-items: center; gap: 9px; }
  .ai-spinner { width: 15px; height: 15px; border: 2px solid #d1d5db; border-top-color: #16305c; border-radius: 50%; flex: none; animation: ai-spin 0.7s linear infinite; }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  .ai-sources { margin-top: 8px; font-size: 12.5px; color: #6b7280; }
  .ai-sources a { color: #16305c; text-decoration: underline; }
  .ai-msg table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14.5px; }
  .ai-msg th, .ai-msg td { border: 1px solid #d1d5db; padding: 6px 9px; text-align: center; }
  .ai-msg thead th { background: #16305c; color: #fff; font-weight: 600; }
  .ai-msg tbody tr:nth-child(even) { background: #f3f4f6; }
  .ai-msg .ans-h { font-weight: 700; margin: 10px 0 4px; color: #16305c; }
  .ai-msg ul { margin: 4px 0; padding-left: 20px; }
  .ai-msg p { margin: 6px 0; }
  .ai-actions { display: flex; gap: 8px; margin-top: 8px; }
  .ai-actions button { font-size: 12.5px; padding: 5px 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #374151; cursor: pointer; }
  .ai-actions button:active { background: #f3f4f6; }
  .ai-inputbar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 0; background: linear-gradient(to top, #fff 70%, transparent); }
  .ai-inputbar textarea { flex: 1; resize: none; font-size: 16px; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 12px; font-family: inherit; min-height: 48px; max-height: 120px; }
  .ai-inputbar button { padding: 0 20px; border: none; border-radius: 12px; background: #16305c; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; }
  .ai-inputbar button:disabled { background: #9ca3af; }
  .ai-suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .ai-suggest button { font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; color: #374151; cursor: pointer; }
</style>

<div class="ai-wrap">

    <div class="ai-perk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>금리·공모주 데이터 자동 연동</div>

  <div class="ai-suggest" id="ai-suggest">

    <button type="button" data-q="최근 발행된 회사채 소식 있어?">최근 회사채 발행 소식</button>
    <button type="button" data-q="미국 금리 인상 가능성 어때?">미국 금리 인상 가능성은?</button>

<div class="ai-wrap" style="position: sticky; bottom: 0; padding-top: 0;">
  <div class="ai-inputbar">
    <textarea id="ai-input" placeholder="금리, 채권, 공모주에 대해 물어보세요" rows="1"></textarea>
    <button id="ai-send">전송</button>
  </div>
</div>

<script>
  const AI_ENDPOINT = "https://hnxvsopwxiamexnxczhj.supabase.co/functions/v1/claude-chat";
  // 이 키는 공개용 anon key라 브라우저에 있어도 안전합니다 (Gemini 키와는 다릅니다).
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhueHZzb3B3eGlhbWV4bnhjemhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjAzNjksImV4cCI6MjA5NzgzNjM2OX0._7LzP4rrjM1F06Dya_vX_kTA4t1jw7DlR6ExWlvhxak";

  const chatEl = document.getElementById('ai-chat');
  const inputEl = document.getElementById('ai-input');
  const sendBtn = document.getElementById('ai-send');

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  document.getElementById('ai-suggest').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-q]');
    if (!btn) return;
    inputEl.value = btn.dataset.q;
    inputEl.focus();
    inputEl.dispatchEvent(new Event('input'));
  });

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function inlineMd(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  // 아주 단순한 마크다운(표 / **굵게** / - 목록 / 문단) → HTML 변환기
  function mdToHtml(text) {
    const lines = String(text ?? '').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];

      if (/^\s*\|.*\|\s*$/.test(line)) {
        const tableLines = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          tableLines.push(lines[i]);
          i++;
        }
        const rows = tableLines.map((l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim()));
        const isSep = (r) => r.every((c) => /^:?-{2,}:?$/.test(c));
        let headerRow = null, bodyRows = rows;
        if (rows.length > 1 && isSep(rows[1])) {
          headerRow = rows[0];
          bodyRows = rows.slice(2);
        }
        html += '<table>';
        if (headerRow) {
          html += '<thead><tr>' + headerRow.map((c) => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead>';
        }
        html += '<tbody>' + bodyRows.map((r) => '<tr>' + r.map((c) => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
        html += '</table>';
        continue;
      }

      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
          i++;
        }
        html += '<ul>' + items.map((it) => `<li>${inlineMd(it)}</li>`).join('') + '</ul>';
        continue;
      }

      if (/^\s*\*\*(.+)\*\*\s*$/.test(line) && line.trim().length < 60) {
        html += `<div class="ans-h">${inlineMd(line.trim().replace(/^\*\*|\*\*$/g, ''))}</div>`;
        i++;
        continue;
      }

      if (line.trim() === '') { i++; continue; }

      html += `<p>${inlineMd(line)}</p>`;
      i++;
    }
    return html;
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'ai-msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  function renderAnswer(div, answer, sources, questionText) {
    div.classList.remove('pending');
    div.innerHTML = mdToHtml(answer);

    if (sources && sources.length) {
      const srcEl = document.createElement('div');
      srcEl.className = 'ai-sources';
      srcEl.innerHTML = '참고 출처: ' + sources.slice(0, 5).map(s =>
        `<a href="${escapeHtml(s.uri)}" target="_blank" rel="noopener">${escapeHtml(s.title || s.uri)}</a>`
      ).join(' · ');
      div.appendChild(srcEl);
    }

    const actions = document.createElement('div');
    actions.className = 'ai-actions';

    const htmlBtn = document.createElement('button');
    htmlBtn.textContent = 'HTML로 저장';
    htmlBtn.onclick = () => saveAsHtml(questionText, answer);
    actions.appendChild(htmlBtn);

    div.appendChild(actions);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function saveAsHtml(question, answer) {
    const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 애널리스트 답변</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;max-width:640px;margin:0 auto;padding:24px 20px;line-height:1.7;font-size:16px;color:#111}
  h1{font-size:18px;border-bottom:2px solid #16305c;padding-bottom:10px}
  .q{background:#16305c;color:#fff;padding:12px 14px;border-radius:10px;margin:16px 0}
  .a{background:#f3f4f6;padding:14px;border-radius:10px}
  .a table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14.5px}
  .a th,.a td{border:1px solid #d1d5db;padding:6px 9px;text-align:center}
  .a thead th{background:#16305c;color:#fff}
  .a tbody tr:nth-child(even){background:#e9eaee}
  .a .ans-h{font-weight:700;margin:10px 0 4px;color:#16305c}
  .foot{margin-top:20px;font-size:12.5px;color:#6b7280}
</style></head><body>
<h1>데일리 마켓 브리핑 · AI 애널리스트</h1>
<div class="q">${escapeHtml(question)}</div>
<div class="a">${mdToHtml(answer)}</div>
<div class="foot">생성 시각: ${new Date().toLocaleString('ko-KR')} · 투자 참고용이며 투자 권유가 아닙니다.</div>
</body></html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ai-answer-${Date.now()}.html`;
    a.click();
  }

  const LOADING_PHASES = [
    '질문을 분석하는 중…',
    '사이트 금리·공모주 데이터 조회 중…',
    '최신 뉴스 웹검색 중…',
    '답변을 정리하는 중…',
  ];

  function setPendingPhase(div, idx) {
    div.innerHTML = `<span class="ai-spinner"></span><span>${LOADING_PHASES[idx % LOADING_PHASES.length]}</span>`;
  }

  async function send() {
    const question = inputEl.value.trim();
    if (!question) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', question);
    const pendingDiv = addMessage('bot pending', '');
    let phaseIdx = 0;
    setPendingPhase(pendingDiv, phaseIdx);
    const phaseTimer = setInterval(() => {
      phaseIdx++;
      setPendingPhase(pendingDiv, phaseIdx);
    }, 2200);

    try {
      const res = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'apikey': SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ question })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || '요청 실패');
      clearInterval(phaseTimer);
      renderAnswer(pendingDiv, json.answer, json.sources, question);
    } catch (err) {
      clearInterval(phaseTimer);
      pendingDiv.classList.remove('pending');
      pendingDiv.textContent = '오류가 발생했습니다: ' + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>
</body>
</html>
