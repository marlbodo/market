<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지난 브리핑 보기 — AI 마켓 브리핑</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: var(--bg-subtle); }
  .popup-wrap { max-width: 720px; margin: 0 auto; padding: 20px 20px 40px; }
  .popup-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; margin-bottom: 12px; border-bottom: 2px solid var(--text);
  }
  .popup-head h1 { font-size: 16px; margin: 0; }
  .popup-close { font-size: 12.5px; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: var(--radius-s); padding: 4px 10px; background: var(--bg); flex: none; }

  /* ---------- 필터 탭 ---------- */
  .hist-filter-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  .hist-count { margin-left: auto; font-size: 11.5px; color: var(--text-faint); }

  /* ---------- 목록 ---------- */
  .hist-list { border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: var(--bg); overflow: hidden; }
  .hist-row { border-top: 1px solid var(--border); }
  .hist-row:first-child { border-top: none; }
  .hist-row-head {
    display: flex; align-items: center; gap: 8px; padding: 11px 12px; cursor: pointer;
  }
  .hist-row-head:hover { background: var(--bg-hover); }
  .hist-date { font-size: 12px; color: var(--text-faint); flex: none; width: 52px; }
  .hist-title { font-size: 13px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-caret { font-size: 10px; color: var(--text-faint); flex: none; transition: transform 0.15s ease; }
  .hist-row.is-open .hist-caret { transform: rotate(90deg); }
  .hist-body { display: none; padding: 4px 16px 20px 16px; }
  .hist-row.is-open .hist-body { display: block; }
  .hist-body-loading { color: var(--text-faint); font-size: 12px; }
  .list-empty { padding: 30px 0; text-align: center; color: var(--text-faint); font-size: 13px; }
  .list-loading { padding: 30px 0; text-align: center; color: var(--text-faint); font-size: 13px; }

  /* [수정 13] 아코디언을 펼쳤을 때 ai-article.html과 동일한 느낌으로 보이도록
     kicker/제목/작성일/본문 스타일을 그대로 가져옴. 모바일에서 목록의 제목이 말줄임표로
     잘려 보이는 문제도 이 안에서 제목 전체(article-title)를 다시 보여줘서 해결한다. */
  .article-kicker { display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:4px; margin-bottom:10px; }
  .article-kicker.bond { color: var(--accent); background: var(--accent-soft); }
  .article-kicker.ipo { color: var(--amber); background: var(--amber-soft); }
  .article-title { font-size: 17px; font-weight: 800; line-height: 1.45; margin: 0 0 6px; letter-spacing: -0.01em; color: var(--text); }
  .article-byline { font-size: 12px; color: var(--text-faint); margin: 0 0 18px; }
  .article-body h2 { font-size: 14.5px; font-weight: 700; margin: 22px 0 8px; padding-left: 10px; border-left: 3px solid var(--border-strong); }
  .article-body.bond h2 { border-left-color: var(--accent); color: var(--accent); }
  .article-body.ipo h2 { border-left-color: var(--amber); color: var(--amber); }
  .article-body p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; color: var(--text); }
  .article-body ul { margin: 0 0 12px; padding-left: 18px; }
  .article-body li { font-size: 14px; margin-bottom: 5px; line-height: 1.55; }
  .article-body table { width: 100%; border-collapse: collapse; margin: 12px 0 16px; font-size: 12.5px; }
  .article-body th, .article-body td { border: 1px solid var(--border); padding: 6px 7px; text-align: center; }
  .article-body th { background: var(--bg-subtle); font-weight: 700; }
  .article-body img { max-width: 100%; }
  /* body_html 안에 이미 "기준일: ..." 형식의 byline이 첫 줄로 들어있는데,
     위에서 "작성일: YYYY. MM. DD. HH:MM" 형식으로 따로 렌더링하므로 중복 숨김 (ai-article.html과 동일 처리) */
  .article-body > .byline:first-child { display: none; }
  .article-ai-badge { font-size: 10.5px; color: var(--text-faint); text-align: right; margin-top: 20px; }

  /* ---------- 페이지네이션 ---------- */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 18px; flex-wrap: wrap; }
  .page-btn {
    min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: var(--radius-s);
    background: var(--bg); color: var(--text-muted); font-size: 12.5px; cursor: pointer;
  }
  .page-btn:hover { background: var(--bg-hover); }
  .page-btn.is-active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="popup-wrap">
    <div class="popup-head">
      <h1>지난 브리핑 보기</h1>
      <button class="popup-close" onclick="window.close()">닫기</button>
    </div>

    <div class="hist-filter-row" id="hist-filter-row">
      <button class="ipo-filter-btn is-active" data-hist-filter="all">전체</button>
      <button class="ipo-filter-btn" data-hist-filter="bond">채권·금리</button>
      <button class="ipo-filter-btn" data-hist-filter="ipo">공모주(IPO)</button>
      <span class="hist-count" id="hist-count">전체: -</span>
    </div>

    <div class="hist-list" id="hist-list">
      <div class="list-loading">지난 브리핑을 불러오는 중…</div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/helpers.js"></script>
<script>
  const AI_INSIGHT_LABELS = { bond: '채권·금리', ipo: '공모주(IPO)' };
  const PAGE_SIZE = 20;      // 한 페이지에 보여줄 브리핑 개수
  const PAGE_GROUP_SIZE = 10; // 페이지 번호 버튼을 한 번에 몇 개까지 보여줄지 (넘으면 "다음" 버튼으로 다음 묶음 이동)

  let ALL_ITEMS = [];   // { id, type, article_date, title }
  let FILTER = 'all';
  let currentPage = 1;
  const bodyCache = new Map(); // id -> body_html (중복 조회 방지)

  function formatDateDot(dateStr) {
    // '2026-09-13' -> '09.13'
    const parts = dateStr.split('-');
    return parts.length === 3 ? `${parts[1]}.${parts[2]}` : dateStr;
  }

  function filteredItems() {
    return FILTER === 'all' ? ALL_ITEMS : ALL_ITEMS.filter((it) => it.type === FILTER);
  }

  function renderList() {
    const listEl = document.getElementById('hist-list');
    const countEl = document.getElementById('hist-count');
    const items = filteredItems();

    countEl.textContent = `전체: ${items.length}개`;

    if (items.length === 0) {
      listEl.innerHTML = '<div class="list-empty">해당하는 브리핑이 없습니다.</div>';
      renderPagination(0);
      return;
    }

    const totalPages = Math.max(Math.ceil(items.length / PAGE_SIZE), 1);
    if (currentPage > totalPages) currentPage = totalPages;
    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageItems = items.slice(startIdx, startIdx + PAGE_SIZE);

    listEl.innerHTML = pageItems.map((it) => `
      <div class="hist-row" data-id="${it.id}" data-type="${it.type}" data-title="${escapeHtml(it.title)}">
        <div class="hist-row-head">
          <span class="hist-date">${formatDateDot(it.article_date)}</span>
          <span class="ai-insight-tag ${it.type}">${AI_INSIGHT_LABELS[it.type] || it.type}</span>
          <span class="hist-title">${escapeHtml(it.title)}</span>
          <span class="hist-caret">▶</span>
        </div>
        <div class="hist-body"></div>
      </div>`).join('');

    listEl.querySelectorAll('.hist-row').forEach((row) => {
      row.querySelector('.hist-row-head').addEventListener('click', () => toggleRow(row));
    });

    renderPagination(totalPages);
  }

  function fmtDateTimeFull(iso) {
    // ai-article.html과 동일한 형식: "2026. 09. 13. 08:00"
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    const parts = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul',
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
    }).formatToParts(d);
    const get = (t) => (parts.find((p) => p.type === t) || {}).value || '';
    return `${get('year')}. ${get('month')}. ${get('day')}. ${get('hour')}:${get('minute')}`;
  }

  async function toggleRow(row) {
    const isOpen = row.classList.contains('is-open');
    if (isOpen) {
      row.classList.remove('is-open');
      return;
    }
    row.classList.add('is-open');

    const id = row.getAttribute('data-id');
    const type = row.getAttribute('data-type');
    const title = row.getAttribute('data-title');
    const bodyEl = row.querySelector('.hist-body');
    if (bodyCache.has(id)) {
      bodyEl.innerHTML = bodyCache.get(id);
      return;
    }

    bodyEl.innerHTML = '<div class="hist-body-loading">본문을 불러오는 중…</div>';
    try {
      const { data, error } = await db
        .from('ai_news_articles')
        .select('body_html, updated_at')
        .eq('id', id)
        .single();
      if (error) throw error;

      // [수정 13] "기준일: ..." (body_html 내부 문구)이 아니라 "작성일: YYYY. MM. DD. HH:MM" 형식으로
      // ai-article.html과 동일하게 표시. body_html 첫 줄의 기존 byline은 CSS로 숨김 처리됨.
      const html = `
        <span class="article-kicker ${type}">${AI_INSIGHT_LABELS[type] || type}</span>
        <h2 class="article-title">${escapeHtml(title)}</h2>
        <div class="article-byline">작성일: ${fmtDateTimeFull(data.updated_at)}</div>
        <div class="article-body ${type}">${(data && data.body_html) || '<p>본문이 없습니다.</p>'}</div>
        <div class="article-ai-badge">이 기사는 Claude AI가 자동 생성했습니다.</div>
      `;
      bodyCache.set(id, html);
      bodyEl.innerHTML = html;
    } catch (err) {
      console.error('브리핑 본문 로딩 실패', err);
      bodyEl.innerHTML = '<div class="hist-body-loading">⚠ 본문을 불러오지 못했습니다.</div>';
    }
  }

  function goToPage(p) {
    currentPage = p;
    renderList();
    document.getElementById('hist-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderPagination(totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    const groupStart = Math.floor((currentPage - 1) / PAGE_GROUP_SIZE) * PAGE_GROUP_SIZE + 1;
    const groupEnd = Math.min(groupStart + PAGE_GROUP_SIZE - 1, totalPages);

    let html = '';
    html += `<button class="page-btn" id="pg-prev" ${groupStart <= 1 ? 'disabled' : ''}>이전</button>`;
    for (let p = groupStart; p <= groupEnd; p++) {
      html += `<button class="page-btn ${p === currentPage ? 'is-active' : ''}" data-page="${p}">${p}</button>`;
    }
    html += `<button class="page-btn" id="pg-next" ${groupEnd >= totalPages ? 'disabled' : ''}>다음</button>`;
    el.innerHTML = html;

    el.querySelectorAll('[data-page]').forEach((btn) => {
      btn.addEventListener('click', () => goToPage(Number(btn.getAttribute('data-page'))));
    });
    const prevBtn = document.getElementById('pg-prev');
    const nextBtn = document.getElementById('pg-next');
    if (prevBtn && !prevBtn.disabled) prevBtn.addEventListener('click', () => goToPage(groupStart - 1));
    if (nextBtn && !nextBtn.disabled) nextBtn.addEventListener('click', () => goToPage(groupEnd + 1));
  }

  document.getElementById('hist-filter-row').querySelectorAll('[data-hist-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#hist-filter-row [data-hist-filter]').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      FILTER = btn.getAttribute('data-hist-filter');
      currentPage = 1;
      renderList();
    });
  });

  (async function loadHistory() {
    const listEl = document.getElementById('hist-list');
    try {
      // 가벼운 목록용 컬럼만 우선 조회하고, 본문(body_html)은 각 행을 펼칠 때 개별 조회한다.
      const { data, error } = await db
        .from('ai_news_articles')
        .select('id, type, article_date, title')
        .order('article_date', { ascending: false })
        .order('id', { ascending: false })
        .limit(500);
      if (error) throw error;

      ALL_ITEMS = data || [];
      renderList();
    } catch (err) {
      console.error('지난 브리핑 로딩 실패', err);
      const msg = (err && err.message) ? err.message : String(err);
      listEl.innerHTML = `<div class="list-empty">⚠ 불러오기 실패: ${escapeHtml(msg)}</div>`;
    }
  })();
</script>
</body>
</html>
