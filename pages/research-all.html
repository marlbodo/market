<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리서치센터 전체보기 — AI 마켓 브리핑</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: var(--bg-subtle); }
  .popup-wrap { max-width: 640px; margin: 0 auto; padding: 20px 20px 40px; }
  .popup-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; margin-bottom: 8px; border-bottom: 2px solid var(--text);
  }
  .popup-head h1 { font-size: 16px; margin: 0; }
  .popup-close { font-size: 12.5px; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: var(--radius-s); padding: 4px 10px; }
  .research-list-all { background: var(--bg); padding: 0 16px; border: 1px solid var(--border); }
  .research-list-all .research-card:first-child { padding-top: 14px; }

  /* ---------- 페이지네이션 (지난 브리핑 보기 페이지와 동일한 느낌: 이전 / 번호 / 다음) ---------- */
  .research-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .research-page-btn {
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-s);
    background: var(--bg);
    color: var(--text-muted);
  }
  .research-page-btn:hover:not(:disabled):not(.is-active) { border-color: var(--accent); color: var(--accent); }
  .research-page-btn.is-active { background: var(--text); border-color: var(--text); color: #fff; cursor: default; }
  .research-page-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <div class="popup-wrap">
    <div class="popup-head">
      <h1>리서치센터 전체보기</h1>
      <button class="popup-close" onclick="window.close()">닫기</button>
    </div>
    <div class="research-list-all" id="research-list-all">
      <div class="list-loading">자료를 불러오는 중…</div>
    </div>
    <nav class="research-pagination" id="research-pagination"></nav>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/helpers.js"></script>
<script>
  const PAGE_SIZE = 10;
  let currentPage = 1;
  let totalCount = 0; // 페이지 수 계산용 (번호 매기기에는 더 이상 안 씀)

  const listEl = document.getElementById('research-list-all');
  const pagerEl = document.getElementById('research-pagination');

  // [수정] 번호(No.X)는 제거 — 리포트가 서로 독립적인 자료라 순번이 의미 없다는 판단.
  // 대신 제목 앞에 문서 아이콘을 붙이고, 날짜는 카드 맨 아래에 작게 부제로 뺀다.
  // "파일 열기" 버튼도 없애고, 파일이 있으면 카드 전체를 클릭 가능한 링크로 만든다.
  const RESEARCH_ICON_SVG =
    '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 2.5h6.5L15 6v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/>' +
    '<path d="M11.5 2.5V6H15"/>' +
    '<path d="M6.5 10h5M6.5 12.5h5M6.5 15h3"/>' +
    '</svg>';

  function renderResearchCards(data) {
    listEl.innerHTML = data.map((r) => {
      const titleInner = escapeHtml(r.title);
      const hasFile = !!r.file_url;
      const summaryText = escapeHtml(truncateText(r.summary, 100));
      const dateText = formatDateTimeFull(r.created_at);

      const inner = `
        <div class="research-card-head">
          <span class="research-icon" aria-hidden="true">${RESEARCH_ICON_SVG}</span>
          <div class="research-title">${titleInner}</div>
        </div>
        <div class="research-desc">${summaryText}</div>
        <div class="research-date">${dateText}</div>`;

      return hasFile
        ? `<a class="research-card" href="${escapeHtml(r.file_url)}" target="_blank" rel="noopener" download>${inner}</a>`
        : `<div class="research-card">${inner}</div>`;
    }).join('');
  }

  // 10개가 넘을 때만 페이지네이션을 그린다 (이전 / 1 / 2 / ... / 다음)
  function renderPagination(totalPages) {
    if (totalPages <= 1) {
      pagerEl.innerHTML = '';
      return;
    }
    const btn = (label, page, opts = {}) => {
      const active = opts.active ? ' is-active' : '';
      const disabled = opts.disabled ? 'disabled' : '';
      return `<button class="research-page-btn${active}" data-page="${page}" ${disabled}>${label}</button>`;
    };
    let html = '';
    html += btn('이전', currentPage - 1, { disabled: currentPage === 1 });
    for (let p = 1; p <= totalPages; p++) {
      html += btn(String(p), p, { active: p === currentPage });
    }
    html += btn('다음', currentPage + 1, { disabled: currentPage === totalPages });
    pagerEl.innerHTML = html;

    pagerEl.querySelectorAll('.research-page-btn').forEach((b) => {
      b.addEventListener('click', () => {
        const page = Number(b.getAttribute('data-page'));
        if (page < 1 || page > totalPages || page === currentPage) return;
        loadPage(page);
      });
    });
  }

  async function loadPage(page) {
    currentPage = page;
    listEl.innerHTML = '<div class="list-loading">자료를 불러오는 중…</div>';

    try {
      const offset = (page - 1) * PAGE_SIZE;

      // count는 페이지를 옮길 때마다 다시 셀 필요 없이, 최초 1회만 가져와 재사용한다.
      const needCount = totalCount === 0;
      const [countRes, dataRes] = await Promise.all([
        needCount
          ? db.from('research_reports').select('id', { count: 'exact', head: true })
          : Promise.resolve({ count: totalCount, error: null }),
        db.from('research_reports')
          .select('id, title, summary, file_url, file_name, created_at')
          .order('created_at', { ascending: false })
          .range(offset, offset + PAGE_SIZE - 1),
      ]);
      if (countRes.error) throw countRes.error;
      if (dataRes.error) throw dataRes.error;

      if (needCount) totalCount = countRes.count ?? 0;

      const data = dataRes.data || [];
      if (data.length === 0) {
        listEl.innerHTML = '<div class="list-empty">등록된 리서치 자료가 없습니다.</div>';
        pagerEl.innerHTML = '';
        return;
      }

      renderResearchCards(data);
      renderPagination(Math.max(1, Math.ceil(totalCount / PAGE_SIZE)));
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<div class="list-empty">자료를 불러오지 못했습니다.</div>';
      pagerEl.innerHTML = '';
    }
  }

  loadPage(1);
</script>
</body>
</html>
